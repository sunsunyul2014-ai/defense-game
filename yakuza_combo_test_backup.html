<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Yakuza Action Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050508; color: white; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box; }
        
        /* 영화 레터박스 느낌 */
        .letterbox { position: absolute; left: 0; width: 100%; height: 12%; background: black; z-index: 10; transition: height 0.3s; }
        .lb-top { top: 0; }
        .lb-bottom { bottom: 0; }

        .title-area { z-index: 20; text-shadow: 2px 2px 10px rgba(0,0,0,1); }
        h1 { margin: 0; font-size: 48px; color: #ff2222; text-transform: uppercase; font-style: italic; letter-spacing: 2px; }
        .desc { font-size: 20px; color: #ccc; margin-top: 10px; }

        #action-ui { z-index: 20; display: flex; flex-direction: column; align-items: flex-end; width: 100%; }
        #combo-display { font-size: 100px; font-weight: 900; color: #ffcc00; text-shadow: 0 0 20px #ff5500, 4px 4px 0 #000; 
                         transform: scale(0.8) skewX(-10deg); transition: transform 0.05s, opacity 0.3s; opacity: 0; }
        
        .hit-word { font-size: 40px; color: white; }

        /* HP 바 UI */
        .hp-container { width: 400px; height: 20px; background: rgba(50,0,0,0.8); border: 2px solid #550000; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #ff8800); transform-origin: left; transition: transform 0.1s; }

        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 5; pointer-events: none; }
    </style>

    <!-- 최신 Three.js 및 Post Processing 모듈 로드 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="letterbox lb-top"></div>
    <div class="letterbox lb-bottom"></div>
    
    <div id="flash"></div>

    <div id="ui">
        <div class="title-area">
            <h1>신주쿠 블록 스트리트</h1>
            <div class="desc">마우스 클릭 연타로 4단 콤보를 구사하세요.</div>
            <div class="hp-container"><div class="hp-bar" id="enemy-hp"></div></div>
        </div>
        <div id="action-ui">
            <div id="combo-display"><span id="combo-num">0</span><span class="hit-word">HIT!</span></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- 1. 코어 설정 (씬, 카메라, 렌더러, 포스트프로세싱) ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.04); // 짙은 밤안개

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
        const baseCamPos = new THREE.Vector3(0, 3.5, 12);
        camera.position.copy(baseCamPos);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio > 1 ? 1.5 : 1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 네온 불빛을 위한 Bloom(빛 번짐) 이펙트 추가
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;  // 밝은 것만 빛나게
        bloomPass.strength = 1.2;   // 빛 번짐 강도
        bloomPass.radius = 0.5;
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.5, 0);
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 2;
        controls.enableDamping = true;

        // --- 2. 영화적 조명 셋업 ---
        scene.add(new THREE.AmbientLight(0x111122, 1.5));
        
        // 붉은/푸른 네온 백라이트
        const backLight1 = new THREE.PointLight(0xff0044, 100, 20);
        backLight1.position.set(-5, 5, -5);
        scene.add(backLight1);

        const backLight2 = new THREE.PointLight(0x0088ff, 100, 20);
        backLight2.position.set(5, 5, -5);
        scene.add(backLight2);

        const mainLight = new THREE.SpotLight(0xffddaa, 100);
        mainLight.position.set(0, 15, 8);
        mainLight.angle = Math.PI / 4;
        mainLight.penumbra = 0.5;
        mainLight.castShadow = true;
        scene.add(mainLight);

        // --- 3. 비 오는 효과 (Particle System) ---
        const rainCount = 10000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        const rainVel = [];
        for(let i=0; i<rainCount; i++) {
            rainPos[i*3] = (Math.random() - 0.5) * 40;
            rainPos[i*3+1] = Math.random() * 20;
            rainPos[i*3+2] = (Math.random() - 0.5) * 40;
            rainVel.push(0.3 + Math.random() * 0.2); // 떨어지는 속도
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.05, transparent: true, opacity: 0.6 });
        const rainParticles = new THREE.Points(rainGeo, rainMat);
        scene.add(rainParticles);

        // --- 4. 도시 배경 생성 (네온 간판 포함) ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.1, metalness: 0.5 }); // 비에 젖은 바닥
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const buildingColors = [0x0a0a0f, 0x101015, 0x050508];
        const neonColors = [0xff0044, 0x00ffcc, 0xffcc00, 0xcc00ff];
        for(let i=0; i<40; i++) {
            const width = 3 + Math.random() * 6;
            const height = 15 + Math.random() * 30;
            const depth = 3 + Math.random() * 6;
            
            const bGeo = new THREE.BoxGeometry(width, height, depth);
            const bMat = new THREE.MeshStandardMaterial({ color: buildingColors[Math.floor(Math.random()*buildingColors.length)] });
            const b = new THREE.Mesh(bGeo, bMat);
            
            const r = 12 + Math.random() * 25;
            const theta = Math.random() * Math.PI * 2;
            b.position.set(Math.cos(theta)*r, height/2, Math.sin(theta)*r);
            scene.add(b);

            // 랜덤 네온사인 부착 (Bloom으로 빛남)
            if(Math.random() > 0.5) {
                const neonGeo = new THREE.BoxGeometry(width + 0.2, 1, 0.5);
                const neonMat = new THREE.MeshBasicMaterial({ color: neonColors[Math.floor(Math.random()*neonColors.length)] });
                const neon = new THREE.Mesh(neonGeo, neonMat);
                neon.position.set(0, (Math.random() - 0.5) * height * 0.8, depth/2);
                b.add(neon);
            }
        }

        // --- 5. 캐릭터 모델링 팩토리 ---
        function createCharacter(skinColor, suitColor, isPlayer) {
            const char = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.4 });
            const suitMat = new THREE.MeshStandardMaterial({ color: suitColor, roughness: 0.8 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), skinMat);
            head.position.y = 3.5;
            head.castShadow = true;
            char.add(head);

            // 야쿠자 스타일 선글라스/안대
            if (isPlayer) {
                const glass = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.4, 0.5), new THREE.MeshBasicMaterial({ color: 0x000000 }));
                glass.position.set(0, 0.2, 1.1);
                head.add(glass);
            }

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.7, 1.8, 16), suitMat);
            body.position.y = 1.8;
            body.castShadow = true;
            char.add(body);

            function createLimb(xPos, yPos, isArm) {
                const pivot = new THREE.Group();
                pivot.position.set(xPos, yPos, 0);

                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.25, 1.2, 16), suitMat);
                mesh.position.y = -0.6;
                mesh.castShadow = true;
                pivot.add(mesh);

                if (isArm) {
                    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), skinMat);
                    hand.position.y = -0.6;
                    mesh.add(hand);
                }
                return pivot;
            }

            const leftArm = createLimb(-1.1, 2.5, true);
            const rightArm = createLimb(1.1, 2.5, true);
            const leftLeg = createLimb(-0.4, 1.2, false);
            const rightLeg = createLimb(0.4, 1.2, false);

            char.add(leftArm); char.add(rightArm);
            char.add(leftLeg); char.add(rightLeg);

            char.parts = { body, head, leftArm, rightArm, leftLeg, rightLeg };
            return char;
        }

        const player = createCharacter(0xffccaa, 0x111111, true);
        player.position.set(-2.5, 0, 0);
        player.rotation.y = Math.PI / 2;
        scene.add(player);

        const enemy = createCharacter(0xccffaa, 0xaa2222, false);
        enemy.position.set(2.5, 0, 0);
        enemy.rotation.y = -Math.PI / 2;
        scene.add(enemy);

        // --- 6. 타격 이펙트 (Hit Sparks) ---
        const sparkGeo = new THREE.BufferGeometry();
        const sparkCount = 30;
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sparkCount * 3), 3));
        sparkGeo.setAttribute('velocity', new THREE.BufferAttribute(new Float32Array(sparkCount * 3), 3));
        const sparkMat = new THREE.PointsMaterial({ color: 0xffcc00, size: 0.2, transparent: true, blending: THREE.AdditiveBlending });
        const sparks = new THREE.Points(sparkGeo, sparkMat);
        sparks.visible = false;
        scene.add(sparks);

        let activeSparks = false;
        let sparkLife = 0;

        function emitSparks(position, color=0xffcc00) {
            sparkMat.color.setHex(color);
            sparks.position.copy(position);
            const posAttr = sparks.geometry.attributes.position;
            const velAttr = sparks.geometry.attributes.velocity;
            for(let i=0; i<sparkCount; i++) {
                posAttr.setXYZ(i, 0, 0, 0);
                // 폭발 형태로 퍼지게 속도 부여
                velAttr.setXYZ(i, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5);
            }
            posAttr.needsUpdate = true;
            sparks.visible = true;
            activeSparks = true;
            sparkLife = 1.0;
        }

        // --- 7. 고급 애니메이션 엔진 (Easing & Timeline) ---
        let tweens = [];
        // 역동적인 타격을 위한 Ease Out Back 함수
        function easeOutBack(x) { const c1=1.70158; const c3=c1+1; return 1+c3*Math.pow(x-1, 3)+c1*Math.pow(x-1, 2); }
        function easeOutQuad(x) { return 1 - (1 - x) * (1 - x); }

        function tweenTo(obj, prop, target, duration, delay=0, easing=easeOutQuad, onComplete=null) {
            const start = obj[prop].clone ? obj[prop].clone() : obj[prop];
            tweens.push({ obj, prop, target, duration, delay, time: 0, start, easing, onComplete });
        }

        // --- 8. 카메라 셰이크 & 힛 스탑 (타격감 핵심) ---
        let hitStopDuration = 0; // 타격 순간 시간이 멈추는 프레임
        let shakeIntensity = 0;
        let targetFov = 45;

        function applyHitStop(ms) { hitStopDuration = ms / 1000; }
        
        function screenShake(intensity) { shakeIntensity = intensity; }

        function flashScreen() {
            const f = document.getElementById("flash");
            f.style.opacity = 0.8;
            setTimeout(() => f.style.opacity = 0, 50);
        }

        // --- 9. 콤보 및 피격 시스템 ---
        let comboCount = 0;
        let isAttacking = false;
        let comboTimer = null;
        let enemyKnockedDown = false;
        let enemyHp = 100;

        const comboDisplay = document.getElementById("combo-display");
        const comboNum = document.getElementById("combo-num");
        const hpBar = document.getElementById("enemy-hp");

        function resetPlayer() {
            isAttacking = false;
            targetFov = 45;
            tweenTo(player.parts.leftArm, 'rotation', new THREE.Euler(0, 0, 0), 0.3);
            tweenTo(player.parts.rightArm, 'rotation', new THREE.Euler(0, 0, 0), 0.3);
            tweenTo(player.parts.rightLeg, 'rotation', new THREE.Euler(0, 0, 0), 0.3);
            tweenTo(player.parts.body, 'rotation', new THREE.Euler(0, 0, 0), 0.3);
            tweenTo(player, 'position', new THREE.Vector3(-2.5, 0, 0), 0.3);
        }

        function enemyHit(power) {
            if(enemyKnockedDown) return;
            
            // HP 깎기 UI
            enemyHp -= power * 5;
            if(enemyHp <= 0) { enemyHp = 100; } // 무한 샌드백 복구
            hpBar.style.transform = `scaleX(${enemyHp / 100})`;

            // 타격 위치 계산 (적의 가슴팍/얼굴 부근)
            const hitPos = new THREE.Vector3(2, 2.5, 0);

            if(power === 4) {
                // 피니시 (4타)
                applyHitStop(150); // 길게 멈춤
                screenShake(0.8);
                flashScreen();
                emitSparks(hitPos, 0xff3300); // 붉은 불꽃
                enemyKnockedDown = true;
                
                // 적 날아가기
                tweenTo(enemy.parts.body, 'rotation', new THREE.Euler(-Math.PI/2, 0, 0), 0.3);
                tweenTo(enemy, 'position', new THREE.Vector3(7, 3, -1), 0.2, 0, easeOutQuad, () => {
                    // 바닥 추락
                    tweenTo(enemy, 'position', new THREE.Vector3(8, 0.5, -2), 0.15, 0, easeOutQuad, () => {
                        screenShake(0.5); // 바닥에 떨어질 때 지진
                        setTimeout(() => {
                            tweenTo(enemy.parts.body, 'rotation', new THREE.Euler(0, 0, 0), 0.5);
                            tweenTo(enemy, 'position', new THREE.Vector3(2.5, 0, 0), 0.5, 0, easeOutQuad, () => {
                                enemyKnockedDown = false;
                            });
                        }, 2000); // 2초 후 기상
                    });
                });
            } else {
                // 일반 타격
                applyHitStop(50);
                screenShake(power * 0.2);
                emitSparks(hitPos);
                
                const push = 2.5 + (power * 0.4);
                tweenTo(enemy.parts.body, 'rotation', new THREE.Euler(-0.2 * power, 0, 0.1), 0.1, 0, easeOutQuad, () => {
                    tweenTo(enemy.parts.body, 'rotation', new THREE.Euler(0, 0, 0), 0.3);
                });
                tweenTo(enemy, 'position', new THREE.Vector3(push, 0, 0), 0.1, 0, easeOutQuad, () => {
                    tweenTo(enemy, 'position', new THREE.Vector3(2.5, 0, 0), 0.3);
                });
            }
        }

        function attack() {
            if(enemyKnockedDown || isAttacking) return;
            
            isAttacking = true;
            comboCount++;
            
            // UI 업데이트
            comboNum.innerText = comboCount;
            comboDisplay.style.opacity = 1;
            comboDisplay.style.transform = "scale(1.1) skewX(-15deg)";
            setTimeout(() => comboDisplay.style.transform = "scale(1) skewX(-10deg)", 50);

            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => { comboCount = 0; comboDisplay.style.opacity = 0; }, 1000);

            // 액션 분기
            switch(comboCount) {
                case 1: // 빠른 왼손
                    tweenTo(player.parts.body, 'rotation', new THREE.Euler(0, 0.3, 0), 0.1);
                    tweenTo(player.parts.leftArm, 'rotation', new THREE.Euler(-Math.PI/2, 0, 0), 0.1, 0, easeOutBack, () => {
                        enemyHit(1);
                        tweenTo(player.parts.leftArm, 'rotation', new THREE.Euler(0, 0, 0), 0.2, 0, easeOutQuad, resetPlayer);
                    });
                    break;
                case 2: // 빠른 오른손
                    tweenTo(player, 'position', new THREE.Vector3(-2.2, 0, 0), 0.1);
                    tweenTo(player.parts.body, 'rotation', new THREE.Euler(0, -0.4, 0), 0.1);
                    tweenTo(player.parts.rightArm, 'rotation', new THREE.Euler(-Math.PI/2, 0, 0), 0.1, 0, easeOutBack, () => {
                        enemyHit(2);
                        tweenTo(player.parts.rightArm, 'rotation', new THREE.Euler(0, 0, 0), 0.2, 0, easeOutQuad, resetPlayer);
                    });
                    break;
                case 3: // 묵직한 왼손 훅 (와인드업 추가)
                    tweenTo(player, 'position', new THREE.Vector3(-2.5, 0, 0.5), 0.15); // 힘모으려 살짝 빠짐
                    tweenTo(player.parts.body, 'rotation', new THREE.Euler(0, 1.0, 0), 0.15); 
                    tweenTo(player.parts.leftArm, 'rotation', new THREE.Euler(-0.2, 0, 1.2), 0.15, 0, easeOutQuad, () => {
                        // 타격
                        tweenTo(player, 'position', new THREE.Vector3(-1.8, 0, 0), 0.1);
                        tweenTo(player.parts.body, 'rotation', new THREE.Euler(0, -0.8, 0), 0.1);
                        tweenTo(player.parts.leftArm, 'rotation', new THREE.Euler(-Math.PI/2.5, 0, -1.0), 0.1, 0, easeOutBack, () => {
                            enemyHit(3);
                            setTimeout(resetPlayer, 250);
                        });
                    });
                    break;
                case 4: // 필살 발차기 (카메라 줌인 & 딜레이 타격)
                    targetFov = 35; // 줌인
                    
                    tweenTo(player.parts.body, 'rotation', new THREE.Euler(0.4, 0, 0), 0.2); // 크게 뒤로 누움
                    tweenTo(player.parts.rightLeg, 'rotation', new THREE.Euler(-0.5, 0, 0), 0.2, 0, easeOutQuad, () => {
                        // 폭발적 발차기
                        tweenTo(player, 'position', new THREE.Vector3(-1.2, 0, 0), 0.1);
                        tweenTo(player.parts.rightLeg, 'rotation', new THREE.Euler(-Math.PI*0.7, 0, 0), 0.1, 0, easeOutBack, () => {
                            enemyHit(4);
                            setTimeout(() => {
                                comboCount = 0;
                                comboDisplay.style.opacity = 0;
                                resetPlayer();
                            }, 600);
                        });
                    });
                    break;
            }

            if(comboCount >= 4) clearTimeout(comboTimer);
        }

        window.addEventListener('mousedown', attack);
        window.addEventListener('keydown', e => { if(e.code === 'Space') attack(); });

        // --- 10. 메인 루프 (렌더링 & 이펙트 업데이트) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let dt = clock.getDelta();

            // 힛 스탑 (시간 정지) 로직
            if (hitStopDuration > 0) {
                hitStopDuration -= dt;
                dt = 0; // 이 프레임에서는 애니메이션 멈춤
            }

            if (dt > 0) {
                // Tween 엔진 업데이트
                for(let i = tweens.length - 1; i >= 0; i--) {
                    const t = tweens[i];
                    if (t.delay > 0) { t.delay -= dt; continue; }
                    
                    t.time += dt;
                    let progress = t.time / t.duration;
                    if(progress >= 1) progress = 1;
                    
                    const ease = t.easing(progress);

                    if (t.start.isEuler) {
                        t.obj[t.prop].x = t.start.x + (t.target.x - t.start.x) * ease;
                        t.obj[t.prop].y = t.start.y + (t.target.y - t.start.y) * ease;
                        t.obj[t.prop].z = t.start.z + (t.target.z - t.start.z) * ease;
                    } else if (t.start.isVector3) {
                        t.obj[t.prop].lerpVectors(t.start, t.target, ease);
                    } else {
                        t.obj[t.prop] = t.start + (t.target - t.start) * ease;
                    }

                    if(progress === 1) {
                        if(t.onComplete) t.onComplete();
                        tweens.splice(i, 1);
                    }
                }

                // 비 파티클 업데이트
                const pos = rainGeo.attributes.position.array;
                for(let i=0; i<rainCount; i++) {
                    pos[i*3+1] -= rainVel[i];
                    if(pos[i*3+1] < 0) pos[i*3+1] = 20; // 땅에 닿으면 위로
                }
                rainGeo.attributes.position.needsUpdate = true;

                // 스파크 파티클 업데이트
                if (activeSparks) {
                    sparkLife -= dt * 3;
                    if(sparkLife <= 0) activeSparks = false;
                    
                    const spos = sparks.geometry.attributes.position.array;
                    const svel = sparks.geometry.attributes.velocity.array;
                    for(let i=0; i<sparkCount; i++) {
                        spos[i*3] += svel[i*3];
                        spos[i*3+1] += svel[i*3+1];
                        spos[i*3+2] += svel[i*3+2];
                    }
                    sparks.geometry.attributes.position.needsUpdate = true;
                    sparkMat.opacity = sparkLife;
                }
            }

            // 카메라 로직 (줌인/줌아웃 부드럽게)
            camera.fov += (targetFov - camera.fov) * 0.1;
            camera.updateProjectionMatrix();

            // 카메라 셰이크
            let shakeX = 0, shakeY = 0;
            if (shakeIntensity > 0) {
                shakeX = (Math.random() - 0.5) * shakeIntensity;
                shakeY = (Math.random() - 0.5) * shakeIntensity;
                shakeIntensity *= 0.8; // 점차 감소
                if(shakeIntensity < 0.01) shakeIntensity = 0;
            }
            
            // 베이스 위치로 복귀 + 셰이크 적용
            camera.position.x += ((baseCamPos.x + shakeX) - camera.position.x) * 0.2;
            camera.position.y += ((baseCamPos.y + shakeY) - camera.position.y) * 0.2;

            controls.update();
            
            // 후처리 포함 렌더링
            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
