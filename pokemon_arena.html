            }
            this.ironTailTimer = 0;

            // 스라크 전용 스탯 (이속이 빠름) 및 타이머
            if (this.species === 'scyther') {
                this.baseSpeed = 6.2;
                this.sprintSpeed = 10.2;
                this.maxCooldowns = { attack: 0.26, q: 5.5, e: 6.5, r: 5.5, f: 14.0 };
            }
            this.uTurnTimer = 0;
            this.doubleTeamTimer = 0;

            // 루카리오 전용 스탯 (빠르다) 및 버프 타이머
            if (this.species === 'lucario') {
                this.baseSpeed = 6.0; // 빠르다! 민첩한 오라 파이터
                this.sprintSpeed = 9.8;
                this.maxCooldowns = { attack: 0.22, q: 5.2, e: 6.0, r: 9.0, f: 12.0 };
            }
            this.boneRushBuffTimer = 0; // 5초간 손에 뼈다귀 들려 평타/신속 강화
            this.boneRushAnchor = null; // 바닥에 박힌 뼈다귀 {x, y, life, maxLife}
            this.boneBoomerangQueue = []; // 뼈다귀 부메랑 10개 순차 발사 큐

            this.animTick = 0;
            this.walkFrame = 0;
            this.aiFocusTarget = null;
            this.aiTargetTimer = 0;
        }

        plantBoneRushAnchor(x, y) {
            const cx = Math.max(FIELD_MIN_X + 25, Math.min(FIELD_MAX_X - 25, x));
            const cy = Math.max(FIELD_MIN_Y + 25, Math.min(FIELD_MAX_Y - 25, y));
            this.boneRushAnchor = {
                x: cx,
                y: cy,
                life: 300, // 5초
                maxLife: 300
            };
            sfx.playBoneRushToss();
            triggerScreenShake(4);
            addGroundDecal(cx, cy, 32, 'crater');
            for (let i = 0; i < 14; i++) {
                const spd = Math.random() * 4 + 1;
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(cx, cy, Math.cos(a) * spd, Math.sin(a) * spd, '#00e5ff', Math.random() * 6 + 3, 16, 'spark'));
            }
            if (!this.isAI) showAlert('🦴 본러시 뼈다귀 박힘! F를 1번 더 눌러 순간이동 강타!');
        }

        // 적 AI가 분신들을 실제 플레이어와 똑같이 인식하고 타겟팅/공격하도록 대상을 선별
        getAITarget(opponent) {
            const validTargets = [opponent, ...scytherClones.filter(c => c.owner === opponent && c.isAlive)];
            if (!this.aiTargetTimer) this.aiTargetTimer = 0;
            this.aiTargetTimer--;

            if (!this.aiFocusTarget || !this.aiFocusTarget.isAlive || this.aiTargetTimer <= 0) {
                if (validTargets.length <= 1) {
                    this.aiFocusTarget = opponent;
                } else {
                    let candidates = [...validTargets];
                    candidates.sort((a, b) => Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y));
                    // 분신과 본체 중 가장 가까운 대상(65%) 또는 근처 다른 분신(35%)에 어그로 집중
                    if (candidates.length >= 2 && Math.random() < 0.35) {
                        const idx = Math.min(candidates.length - 1, 1 + Math.floor(Math.random() * (candidates.length - 1)));
                        this.aiFocusTarget = candidates[idx];
                    } else {
                        this.aiFocusTarget = candidates[0];
                    }
                }
                this.aiTargetTimer = Math.floor(Math.random() * 45 + 30); // 약 0.5 ~ 1.25초 동안 타겟 집중 후 재탐색
            }
            return this.aiFocusTarget || opponent;
        }

        update(opponent) {
            if (!this.isAlive) return;
            this.animTick++;
            if (this.invincibleTimer > 0) this.invincibleTimer--;
            if (this.attackMotionTimer > 0) this.attackMotionTimer--;

            let currentBaseSpeed = this.baseSpeed;
            if (this.stunTimer > 0) {
                this.stunTimer--;
                this.vx *= 0.75;
                this.vy *= 0.75;
                this.state = 'stun';
                if (Math.random() < 0.6) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 28,
                        this.y + (Math.random() - 0.5) * 28,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        Math.random() < 0.6 ? '#ffd700' : '#ffffff',
                        Math.random() * 7 + 3,
                        16,
                        'spark'
                    ));
                }
            } else if (this.slowTimer > 0) {
                this.slowTimer--;
                currentBaseSpeed *= (1 - this.slowAmount);
                if (Math.random() < 0.3) {
                    particles.push(new Particle(this.x, this.y, 0, -1, '#80d8ff', 4, 15, 'circle'));
                }
            }

            for (const key in this.cooldowns) {
                if (this.cooldowns[key] > 0) {
                    this.cooldowns[key] = Math.max(0, this.cooldowns[key] - 1 / 60);
                }
            }

            // 루카리오: 5초간 본러시 버프 타이머
            if (this.boneRushBuffTimer > 0) {
                this.boneRushBuffTimer--;
                if (Math.random() < 0.5) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 20,
                        this.y + (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 1.5,
                        -Math.random() * 2 - 1,
                        Math.random() < 0.6 ? '#00e5ff' : '#2979ff',
                        Math.random() * 5 + 3,
                        14,
                        'spark'
                    ));
                }
            }

            // 루카리오: 바닥에 박힌 뼈다귀 유지시간 관리
            if (this.boneRushAnchor) {
                this.boneRushAnchor.life--;
                if (Math.random() < 0.45) {
                    particles.push(new Particle(
                        this.boneRushAnchor.x + (Math.random() - 0.5) * 16,
                        this.boneRushAnchor.y + (Math.random() - 0.5) * 8,
                        0,
                        -Math.random() * 2 - 0.5,
                        '#00e5ff',
                        Math.random() * 6 + 3,
                        14,
                        'spark'
                    ));
                }
                if (this.boneRushAnchor.life <= 0) {
                    this.boneRushAnchor = null;
                    if (this.cooldowns.f <= 0) this.cooldowns.f = this.maxCooldowns.f;
                }
            }

            // 루카리오: 뼈다귀 부메랑 10발 순차 발사 큐 처리
            if (this.boneBoomerangQueue && this.boneBoomerangQueue.length > 0) {
                for (let i = this.boneBoomerangQueue.length - 1; i >= 0; i--) {
                    const item = this.boneBoomerangQueue[i];
                    item.delay--;
                    if (item.delay <= 0) {
                        this.boneBoomerangQueue.splice(i, 1);
                        const fireAngle = this.aimAngle + item.angleOffset;
                        const spd = 24;
                        projectiles.push(new Projectile({
                            x: this.x + Math.cos(fireAngle) * 32,
                            y: this.y + Math.sin(fireAngle) * 32,
                            vx: Math.cos(fireAngle) * spd,
                            vy: Math.sin(fireAngle) * spd,
                            speed: spd,
                            radius: 16,
                            damage: 14,
                            owner: this,
                            type: 'bone_boomerang',
                            life: 140,
                            piercing: true,
                            knockback: 4,
                            aimAngle: fireAngle
                        }));
                        sfx.playBoneBoomerang();
                    }
                }
            }

            if (this.state !== 'sprint' && this.stamina < this.maxStamina) {
                this.stamina = Math.min(this.maxStamina, this.stamina + 0.45);
            }

            if (this.state === 'stun' || this.stunTimer > 0) {
                this.vx *= 0.8;
                this.vy *= 0.8;
                if (this.stunTimer <= 0) this.state = 'idle';

            } else if (this.state === 'hurt' || this.state === 'knockdown') {
                this.vx *= 0.92;
                this.vy *= 0.92;
                this.stateTimer--;
                if (this.stateTimer <= 0) this.state = 'idle';

            } else if (this.state === 'braking') {
                this.vx *= 0.84;
                this.vy *= 0.84;
                this.stateTimer--;
                if (Math.random() < 0.7) {
                    particles.push(new Particle(this.x, this.y + 15, (Math.random() - 0.5) * 3, -Math.random() * 2, '#cfd8dc', Math.random() * 9 + 4, 20, 'circle'));
                }
                if (this.stateTimer <= 0) this.state = 'idle';

            } else if (this.state === 'charging') {
                this.updateCharge(opponent);

            } else if (this.state === 'quick_attack') {
                this.updateQuickAttack(opponent);

            } else if (this.state === 'iron_tail') {
                this.updateIronTail(opponent);

            } else if (this.state === 'uturn_dash') {
                this.updateUTurnDash(opponent);

            } else if (this.state === 'double_team_motion') {
                this.updateDoubleTeamMotion(opponent);

            } else if (this.state === 'whirlpool') {
                this.updateWhirlpool(opponent);

            } else if (this.state === 'flamethrower') {
                this.updateFlamethrower(opponent);

            } else if (this.state === 'petal_blizzard') {
                this.updatePetalBlizzard(opponent);

            } else if (this.state === 'solarbeam_charge') {
                this.updateSolarBeamCharge(opponent);

            } else if (this.state === 'solarbeam_fire') {
                this.updateSolarBeamFire(opponent);

            } else {
                if (this.isAI) {
                    const aiTarget = this.getAITarget(opponent);
                    this.updateAI(aiTarget, currentBaseSpeed);
                } else {
                    this.updatePlayerMovement(currentBaseSpeed);
                }
            }

            this.x += this.vx;
            this.y += this.vy;

            // 대형 스타디움 이동 가능 경계 체크
            if (this.x < FIELD_MIN_X) { this.x = FIELD_MIN_X; this.vx *= -0.3; }
            if (this.x > FIELD_MAX_X) { this.x = FIELD_MAX_X; this.vx *= -0.3; }
            if (this.y < FIELD_MIN_Y) { this.y = FIELD_MIN_Y; this.vy *= -0.3; }
            if (this.y > FIELD_MAX_Y) { this.y = FIELD_MAX_Y; this.vy *= -0.3; }

            // 조준 방향 갱신 (솔라빔 차징 및 발사 중에는 방향 조절이 훨씬 더 느리게 서서히 회전!)
            if (!this.isAI) {
                if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') {
                    const targetAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                    let diff = targetAngle - this.aimAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    // 발사 중 회전 속도 0.010으로 대폭 느리게 너프! (차징 중 0.022)
                    const turnRate = (this.state === 'solarbeam_fire') ? 0.010 : 0.022;
                    this.aimAngle += diff * turnRate;
                    this.facingLeft = (Math.cos(this.aimAngle) < 0);
                } else {
                    this.aimAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                    this.facingLeft = (mouse.x < this.x);
                }
            } else {
                const targetObj = (this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') {
                    const targetAngle = Math.atan2(targetObj.y - this.y, targetObj.x - this.x);
                    let diff = targetAngle - this.aimAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    // 발사 중 회전 속도 0.010으로 대폭 느리게 너프! (차징 중 0.022)
                    const turnRate = (this.state === 'solarbeam_fire') ? 0.010 : 0.022;
                    this.aimAngle += diff * turnRate;
                    this.facingLeft = (Math.cos(this.aimAngle) < 0);
                } else {
                    this.aimAngle = Math.atan2(targetObj.y - this.y, targetObj.x - this.x);
                    this.facingLeft = (targetObj.x < this.x);
                }
            }
        }

        updatePlayerMovement(speed) {
            let moveX = 0; let moveY = 0;
            if (keys['w']) moveY -= 1;
            if (keys['s']) moveY += 1;
            if (keys['a']) moveX -= 1;
            if (keys['d']) moveX += 1;

            const isMoving = (moveX !== 0 || moveY !== 0);

            // 달리기 토글 유지 판정 (1번 누르면 켜지고, 다시 누르면 꺼짐)
            let isSprinting = this.isSprintToggled && isMoving && (this.stamina > 3);

            if (isSprinting) {
                this.stamina = Math.max(0, this.stamina - 0.45);
                if (this.stamina <= 0) {
                    this.isSprintToggled = false;
                    showAlert('🚶 STAMINA DEPLETED!');
                    if (typeof updateSprintTag === 'function') updateSprintTag();
                }
            }

            const currentSpeed = isSprinting ? this.sprintSpeed : speed;

            if (isMoving) {
                const len = Math.hypot(moveX, moveY);
                this.vx = (moveX / len) * currentSpeed;
                this.vy = (moveY / len) * currentSpeed;
                this.state = isSprinting ? 'sprint' : 'run';
                this.walkFrame += isSprinting ? 0.32 : 0.22;

                if (isSprinting && Math.random() < 0.4) {
                    particles.push(new Particle(this.x, this.y + 15, -this.vx * 0.3, -Math.random() * 1.5, '#eceff1', 5, 14, 'circle'));
                }
            } else {
                this.vx *= 0.6;
                this.vy *= 0.6;
                this.state = 'idle';
            }
        }

        updateCharge(opponent) {
            let targetSteerAngle = this.chargeAngle;
            if (!this.isAI) {
                targetSteerAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            } else {
                targetSteerAngle = Math.atan2(opponent.y - this.y, opponent.x - this.x);
            }

            let diff = targetSteerAngle - this.chargeAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.chargeAngle += diff * 0.06;

            this.vx = Math.cos(this.chargeAngle) * this.chargeSpeed;
            this.vy = Math.sin(this.chargeAngle) * this.chargeSpeed;
            this.chargeDistance += this.chargeSpeed;
            this.shellSpinAngle += 0.55;

            if (this.species === 'charmander') {
                particles.push(new Particle(this.x - Math.cos(this.chargeAngle) * 20, this.y - Math.sin(this.chargeAngle) * 20, -this.vx * 0.2, (Math.random() - 0.5) * 3, '#ff5722', Math.random() * 9 + 4, 18, 'flame'));
            } else {
                particles.push(new Particle(this.x - Math.cos(this.chargeAngle) * 20, this.y - Math.sin(this.chargeAngle) * 20, -this.vx * 0.2, (Math.random() - 0.5) * 3, '#00e5ff', Math.random() * 9 + 4, 18, 'circle'));
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                if (proj.type === 'bubble' && proj.owner !== this) {
                    const dist = Math.hypot(proj.x - this.x, proj.y - this.y);
                    if (dist <= this.radius + proj.radius) {
                        proj.popEffect();
                        proj.life = 0;
                        this.takeDamage(20, proj.owner, false, -this.vx * 0.3, -this.vy * 0.3);
                        this.applySlow(0.5, 90);
                        this.state = 'braking';
                        this.stateTimer = 25;
                        sfx.playBrake();
                        showAlert('BUBBLE TACKLE BLOCKED!');
                        return;
                    }
                }
            }

            const potentialTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            let hitTarget = null;
            for (const t of potentialTargets) {
                if (Math.hypot(t.x - this.x, t.y - this.y) <= this.radius + t.radius) {
                    hitTarget = t;
                    break;
                }
            }
            if (hitTarget) {
                const kbX = Math.cos(this.chargeAngle) * 26;
                const kbY = Math.sin(this.chargeAngle) * 26;
                hitTarget.takeDamage(120, this, true, kbX, kbY);

                addGroundDecal((this.x + hitTarget.x) / 2, (this.y + hitTarget.y) / 2, 38, 'crater');
                triggerHitstop(10);
                triggerScreenShake(22);
                sfx.playHit();
                sfx.playTackle();
                showAlert('HEAVY IMPACT!');

                this.vx = -Math.cos(this.chargeAngle) * 4;
                this.vy = -Math.sin(this.chargeAngle) * 4;
                this.state = 'idle';
                return;
            }

            if (this.chargeDistance >= this.maxChargeDistance) {
                this.state = 'braking';
                this.stateTimer = 22;
                addGroundDecal(this.x, this.y, 24, 'skid');
                sfx.playBrake();
                showAlert('SKID BRAKE!');
            }
        }

        updateWhirlpool(opponent) {
            this.whirlpoolTimer--;
            this.shellSpinAngle += 0.7;
            this.vx *= 0.85;
            this.vy *= 0.85;

            const radius = 220;
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * radius;
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, -Math.sin(angle) * 8.5, Math.cos(angle) * 8.5, Math.random() < 0.5 ? '#00e5ff' : '#ffffff', Math.random() * 11 + 5, 20, 'circle'));
            }

            const whirlpoolTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            if (this.whirlpoolTimer % 10 === 0) {
                for (const tgt of whirlpoolTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const pullAngle = Math.atan2(this.y - tgt.y, this.x - tgt.x);
                        tgt.takeDamage(26, this, false, Math.cos(pullAngle) * 3.5, Math.sin(pullAngle) * 3.5);
                        triggerScreenShake(3.5);
                        sfx.playWater();
                    }
                }
            }

            if (this.whirlpoolTimer <= 0) {
                sfx.playWater();
                triggerScreenShake(14);
                addGroundDecal(this.x, this.y, 45, 'water');
                for (const tgt of whirlpoolTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const blastAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                        tgt.takeDamage(70, this, true, Math.cos(blastAngle) * 17, Math.sin(blastAngle) * 17);
                    }
                }
                this.state = 'idle';
            }
        }

        updateFlamethrower(opponent) {
            this.flameChannelTimer--;
            this.vx *= 0.55;
            this.vy *= 0.55;

            if (this.flameChannelTimer % 4 === 0) {
                const streamAngle = this.aimAngle + (Math.random() - 0.5) * 0.2;
                const spd = Math.random() * 6 + 18;

                projectiles.push(new Projectile({
                    x: this.x + Math.cos(this.aimAngle) * 32,
                    y: this.y + Math.sin(this.aimAngle) * 32,
                    vx: Math.cos(streamAngle) * spd,
                    vy: Math.sin(streamAngle) * spd,
                    speed: spd,
                    radius: 22,
                    damage: 12,
                    owner: this,
                    type: 'flamethrower',
                    life: 30,
                    piercing: true,
                    isBlockable: false,
                    knockback: 1.4
                }));
            }

            if (this.flameChannelTimer % 10 === 0) {
                sfx.playFire();
                triggerScreenShake(1.5);
            }

            if (this.flameChannelTimer <= 0) {
                this.state = 'idle';
            }
        }

        // --- 이상해씨 E스킬: 꽃보라 (전방위 360도 공격, 범위 220px) ---
        updatePetalBlizzard(opponent) {
            this.petalBlizzardTimer--;
            this.vx *= 0.88;
            this.vy *= 0.88;

            const radius = 220; // 꼬부기 물회오리와 동일한 반경 220px
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * radius;
                const petalColor = Math.random() < 0.4 ? '#ff80ab' : (Math.random() < 0.7 ? '#f48fb1' : '#b9f6ca');
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, -Math.sin(angle) * 7.5, Math.cos(angle) * 7.5, petalColor, Math.random() * 8 + 4, 22, 'petal'));
            }

            // 매 10프레임마다 다단히트 피해
            const blizzardTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            if (this.petalBlizzardTimer % 10 === 0) {
                for (const tgt of blizzardTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const knockAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                        tgt.takeDamage(24, this, false, Math.cos(knockAngle) * 5, Math.sin(knockAngle) * 5);
                        triggerScreenShake(3);
                        sfx.playEnergyBall();
                    }
                }
            }

            // 종료 시 피날레 꽃보라 방출
            if (this.petalBlizzardTimer <= 0) {
                triggerScreenShake(14);
                sfx.playEnergyBall();
                for (const tgt of blizzardTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const blastAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                        tgt.takeDamage(75, this, true, Math.cos(blastAngle) * 18, Math.sin(blastAngle) * 18);
                    }
                }
                this.state = 'idle';
            }
        }

        // --- 이상해씨 F스킬: 솔라빔 차징 (움직일 수 없고 끊기지 않음, 방향 조절 가능) ---
        updateSolarBeamCharge(opponent) {
            this.solarChargeTimer--;
            this.vx = 0;
            this.vy = 0;

            // 주변에서 꽃봉오리로 모여드는 태양 에너지 파티클
            for (let i = 0; i < 4; i++) {
                const a = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 40;
                const spd = dist / 15;
                particles.push(new Particle(this.x + Math.cos(a) * dist, this.y + Math.sin(a) * dist, -Math.cos(a) * spd, -Math.sin(a) * spd, Math.random() < 0.5 ? '#ffff00' : '#76ff03', Math.random() * 6 + 3, 16, 'circle'));
            }

            if (this.solarChargeTimer % 12 === 0) {
                triggerScreenShake(1.5);
            }

            // 차징 완료 -> 강력한 솔라빔 발사!
            if (this.solarChargeTimer <= 0) {
                this.state = 'solarbeam_fire';
                this.solarFireTimer = 32;
                sfx.playSolarBeam();
                triggerScreenShake(20);
                triggerHitstop(6);
                showAlert('☀️ SOLAR BEAM! ☀️');
            }
        }

        // --- 이상해씨 F스킬: 솔라빔 발사 (극태 레이저 광선) ---
        updateSolarBeamFire(opponent) {
            this.solarFireTimer--;
            this.vx = 0;
            this.vy = 0;

            const beamLength = 1300;
            const beamWidth = 65;

            // 빔 타격 판정 (직선 세그먼트 충돌 - 본체 및 분신)
            const beamTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            if (this.solarFireTimer % 4 === 0) {
                const startX = this.x + Math.cos(this.aimAngle) * 20;
                const startY = this.y + Math.sin(this.aimAngle) * 20;
                const endX = startX + Math.cos(this.aimAngle) * beamLength;
                const endY = startY + Math.sin(this.aimAngle) * beamLength;

                const dx = endX - startX;
                const dy = endY - startY;
                const l2 = dx * dx + dy * dy;

                for (const tgt of beamTargets) {
                    let t = ((tgt.x - startX) * dx + (tgt.y - startY) * dy) / l2;
                    t = Math.max(0, Math.min(1, t));

                    const projX = startX + t * dx;
                    const projY = startY + t * dy;
                    const distToBeam = Math.hypot(tgt.x - projX, tgt.y - projY);

                    if (distToBeam <= beamWidth / 2 + tgt.radius) {
                        const kbX = Math.cos(this.aimAngle) * 7;
                        const kbY = Math.sin(this.aimAngle) * 7;
                        tgt.takeDamage(45, this, true, kbX, kbY);
                        triggerScreenShake(4);

                        for (let p = 0; p < 3; p++) {
                            particles.push(new Particle(tgt.x, tgt.y, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, '#ffffff', 8, 20, 'star'));
                        }
                    }
                }
            }

            // 빔 이펙트 파티클
            for (let i = 0; i < 5; i++) {
                const dist = Math.random() * beamLength;
                const bx = this.x + Math.cos(this.aimAngle) * dist + (Math.random() - 0.5) * beamWidth;
                const by = this.y + Math.sin(this.aimAngle) * dist + (Math.random() - 0.5) * beamWidth;
                particles.push(new Particle(bx, by, Math.cos(this.aimAngle) * 12, Math.sin(this.aimAngle) * 12, '#ccff90', Math.random() * 8 + 4, 12, 'circle'));
            }

            if (this.solarFireTimer <= 0) {
                this.state = 'idle';
            }
        }

        // --- 피카츄 Q스킬: 전광석화 (극강의 방향전환과 속도로 돌진, 맞으면 밀쳐짐) ---
        updateQuickAttack(opponent) {
            let targetSteerAngle = this.chargeAngle;
            if (!this.isAI) {
                targetSteerAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            } else {
                const focusTarget = (this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                targetSteerAngle = Math.atan2(focusTarget.y - this.y, focusTarget.x - this.x);
            }

            let diff = targetSteerAngle - this.chargeAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.chargeAngle += diff * 0.18;

            this.vx = Math.cos(this.chargeAngle) * this.chargeSpeed;
            this.vy = Math.sin(this.chargeAngle) * this.chargeSpeed;
            this.chargeDistance += this.chargeSpeed;

            // 전광석화 번개 스피드라인 & 스파크 잔상
            for (let i = 0; i < 2; i++) {
                const off = (Math.random() - 0.5) * 16;
                particles.push(new Particle(
                    this.x - Math.cos(this.chargeAngle) * 22 + Math.sin(this.chargeAngle) * off,
                    this.y - Math.sin(this.chargeAngle) * 22 - Math.cos(this.chargeAngle) * off,
                    -this.vx * 0.25,
                    -this.vy * 0.25,
                    Math.random() < 0.6 ? '#fff59d' : '#00e5ff',
                    Math.random() * 8 + 4,
                    16,
                    'spark'
                ));
            }

            // 적 충돌 판정 (본체 및 분신)
            const quickTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            let hitTarget = null;
            for (const tgt of quickTargets) {
                if (Math.hypot(tgt.x - this.x, tgt.y - this.y) <= this.radius + tgt.radius) {
                    hitTarget = tgt;
                    break;
                }
            }
            if (hitTarget) {
                const kbX = Math.cos(this.chargeAngle) * 28;
                const kbY = Math.sin(this.chargeAngle) * 28;
                hitTarget.takeDamage(125, this, true, kbX, kbY);

                addGroundDecal((this.x + hitTarget.x) / 2, (this.y + hitTarget.y) / 2, 40, 'crater');
                addGroundDecal((this.x + hitTarget.x) / 2, (this.y + hitTarget.y) / 2, 32, 'electric');
                triggerHitstop(9);
                triggerScreenShake(22);
                sfx.playHit();
                sfx.playQuickAttack();
                showAlert('⚡ QUICK ATTACK HIT! ⚡');

                this.vx = -Math.cos(this.chargeAngle) * 5;
                this.vy = -Math.sin(this.chargeAngle) * 5;
                this.state = 'idle';
                return;
            }

            if (this.chargeDistance >= this.maxChargeDistance) {
                this.state = 'braking';
                this.stateTimer = 18;
                addGroundDecal(this.x, this.y, 26, 'skid');
                sfx.playBrake();
                showAlert('SKID BRAKE!');
            }
        }

        // --- 피카츄 E스킬: 아이언테일 (휘두르기 딜레이) ---
        updateIronTail(opponent) {
            this.ironTailTimer--;
            this.vx *= 0.75;
            this.vy *= 0.75;

            if (this.ironTailTimer <= 0) {
                this.state = 'idle';
            }
        }

        // --- 스라크 Q스킬: 유턴 (순간이동급 빠른 돌진, 적 타격 시 원래 자리로 복귀, 안 맞으면 그 자리로 이동) ---
        updateUTurnDash(opponent) {
            this.uTurnTimer++;
            this.vx = 0;
            this.vy = 0;

            // 잔상 스피드라인 및 분신 잔상 파티클
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(
                    this.x + (Math.random() - 0.5) * 16,
                    this.y + (Math.random() - 0.5) * 16,
                    -Math.cos(this.uTurnAngle) * 2,
                    -Math.sin(this.uTurnAngle) * 2,
                    Math.random() < 0.6 ? '#76ff03' : '#b2ff59',
                    Math.random() * 8 + 4,
                    14,
                    'spark'
                ));
            }

            const prevX = this.x;
            const prevY = this.y;
            const remaining = this.uTurnTotalDist - this.uTurnTraveled;
            const step = Math.min(this.uTurnSpeed, Math.max(0, remaining));
            this.uTurnTraveled += step;

            const tRatio = (this.uTurnTotalDist > 0) ? Math.min(1, this.uTurnTraveled / this.uTurnTotalDist) : 1;
            this.x = this.uTurnStartX + (this.uTurnTargetX - this.uTurnStartX) * tRatio;
            this.y = this.uTurnStartY + (this.uTurnTargetY - this.uTurnStartY) * tRatio;

            // 선분과 점 사이의 거리 계산 (초고속 대시 관통 터널링 방지)
            const distToSegment = (px, py, x1, y1, x2, y2) => {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const lenSq = dx * dx + dy * dy;
                if (lenSq === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
            };

            // 적 충돌 검사 (opponent 및 적 분신들 - 선분 연속 충돌 및 관통 방지)
            const potentialTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            let hitTarget = null;
            let closestHitDist = Infinity;
            for (const tgt of potentialTargets) {
                if (!tgt || !tgt.isAlive) continue;
                const segDist = distToSegment(tgt.x, tgt.y, prevX, prevY, this.x, this.y);
                const currDist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                const hitThreshold = this.radius + tgt.radius + 32;
                if (segDist <= hitThreshold || currDist <= hitThreshold) {
                    if (segDist < closestHitDist) {
                        closestHitDist = segDist;
                        hitTarget = tgt;
                    }
                }
            }

            if (hitTarget) {
                // "적이 맞으면 원래 자리로 돌아옴"
                hitTarget.takeDamage(115, this, true, Math.cos(this.uTurnAngle) * 18, Math.sin(this.uTurnAngle) * 18);
                spawnXScissorFX(hitTarget.x, hitTarget.y, this.uTurnAngle, 55);
                sfx.playHit();
                sfx.playSlash();
                triggerHitstop(6);
                triggerScreenShake(14);
                addGroundDecal(hitTarget.x, hitTarget.y, 35, 'crater');

                // 출발지와 피격 지점 순간이동 텔레포트 잔상
                for (let i = 0; i < 12; i++) {
                    const spd = Math.random() * 6 + 2;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#76ff03', 7, 16, 'spark'));
                    particles.push(new Particle(this.uTurnStartX, this.uTurnStartY, Math.cos(a) * spd, Math.sin(a) * spd, '#00e676', 7, 16, 'spark'));
                }

                // 원래 자리로 즉각 복귀!
                this.x = this.uTurnStartX;
                this.y = this.uTurnStartY;
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                showAlert('↩️ U-TURN HIT & RETURN! (원래 자리 복귀!) ↩️');
                return;
            }

            // 목적지 도달 시 (적에게 안 맞았거나 적이 없을 때): "타겟한 위치에 적이 없거나 안맞으면 그자리로 이동"
            if (this.uTurnTraveled >= this.uTurnTotalDist || this.uTurnTimer >= this.uTurnMaxTicks) {
                for (const tgt of potentialTargets) {
                    if (!tgt || !tgt.isAlive) continue;
                    if (Math.hypot(tgt.x - this.uTurnTargetX, tgt.y - this.uTurnTargetY) <= this.radius + tgt.radius + 32) {
                        hitTarget = tgt;
                        break;
                    }
                }
                if (hitTarget) {
                    hitTarget.takeDamage(115, this, true, Math.cos(this.uTurnAngle) * 18, Math.sin(this.uTurnAngle) * 18);
                    spawnXScissorFX(hitTarget.x, hitTarget.y, this.uTurnAngle, 55);
                    sfx.playHit();
                    sfx.playSlash();
                    triggerHitstop(6);
                    triggerScreenShake(14);
                    this.x = this.uTurnStartX;
                    this.y = this.uTurnStartY;
                    this.vx = 0;
                    this.vy = 0;
                    this.state = 'idle';
                    showAlert('↩️ U-TURN HIT & RETURN! (원래 자리 복귀!) ↩️');
                    return;
                }

                this.x = this.uTurnTargetX;
                this.y = this.uTurnTargetY;
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                showAlert('↩️ U-TURN (타겟 위치 도달) ↩️');
            }
        }

        // --- 스라크 F스킬: 그림자 분신술 (양쪽으로 빠르게 움직이다 분신 5개 소환, 보통급 지능, 시저크로스만 사용 가능, 체력 80) ---
        updateDoubleTeamMotion(opponent) {
            this.doubleTeamTimer--;
            // 좌우/전후 초고속 지그재그 분신 잔상 모션
            const zig = Math.sin(this.doubleTeamTimer * 1.6) * 18;
            this.vx = Math.cos(this.aimAngle + Math.PI / 2) * zig;
            this.vy = Math.sin(this.aimAngle + Math.PI / 2) * zig;

            particles.push(new Particle(
                this.x + (Math.random() - 0.5) * 30,
                this.y + (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 6,
                (Math.random() - 0.5) * 6,
                Math.random() < 0.5 ? '#b2ff59' : '#ffffff',
                Math.random() * 8 + 4,
                12,
                'spark'
            ));

            if (this.doubleTeamTimer <= 0) {
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                sfx.playClone();
                triggerScreenShake(8);

                // 분신 5개 생성 (체력 80, 보통급 지능, 시저크로스만 사용 가능)
                const numClones = 5;
                for (let i = 0; i < numClones; i++) {
                    const spawnAngle = (i * Math.PI * 2) / numClones + Math.random() * 0.2;
                    const spawnDist = 115;
                    const cx = Math.max(FIELD_MIN_X + 25, Math.min(FIELD_MAX_X - 25, this.x + Math.cos(spawnAngle) * spawnDist));
                    const cy = Math.max(FIELD_MIN_Y + 25, Math.min(FIELD_MAX_Y - 25, this.y + Math.sin(spawnAngle) * spawnDist));

                    scytherClones.push(new ScytherClone({
                        owner: this,
                        x: cx,
                        y: cy,
                        index: i
                    }));

                    for (let p = 0; p < 10; p++) {
                        const spd = Math.random() * 5 + 2;
                        const a = Math.random() * Math.PI * 2;
                        particles.push(new Particle(cx, cy, Math.cos(a) * spd, Math.sin(a) * spd, '#b0bec5', Math.random() * 7 + 4, 18, 'circle'));
                    }
                }
                showAlert('👥 그림자 분신술 (5기 소환 완료! 체력 80) 👥');
            }
        }

        useSkill(slot) {

                this.state === 'whirlpool' || this.state === 'flamethrower' ||
