                    this.cooldowns.e = this.maxCooldowns.e;
                    const aiTarget = (this.isAI && this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                    const targetX = this.isAI ? aiTarget.x : mouse.x;
                    const targetY = this.isAI ? aiTarget.y : mouse.y;

                    const maxTeleportDist = isBuffed ? 720 : 580;
                    const distToTarget = Math.hypot(targetX - this.x, targetY - this.y);
                    const actualDist = Math.min(distToTarget, maxTeleportDist);
                    const teleAngle = Math.atan2(targetY - this.y, targetX - this.x);

                    const startX = this.x;
                    const startY = this.y;
                    const endX = Math.max(FIELD_MIN_X + 25, Math.min(FIELD_MAX_X - 25, this.x + Math.cos(teleAngle) * actualDist));
                    const endY = Math.max(FIELD_MIN_Y + 25, Math.min(FIELD_MAX_Y - 25, this.y + Math.sin(teleAngle) * actualDist));

                    // 출발지 파티클
                    for (let i = 0; i < 14; i++) {
                        const spd = Math.random() * 6 + 2;
                        const a = Math.random() * Math.PI * 2;
                        particles.push(new Particle(startX, startY, Math.cos(a) * spd, Math.sin(a) * spd, '#ffffff', 6, 16, 'spark'));
                        particles.push(new Particle(startX, startY, Math.cos(a) * spd, Math.sin(a) * spd, isBuffed ? '#00e5ff' : '#2979ff', 8, 18, 'spark'));
                    }

                    // 순간이동 수행
                    this.x = endX;
                    this.y = endY;
                    this.vx = 0;
                    this.vy = 0;
                    sfx.playExtremeSpeed();

                    // 도착지 주변 폭발 충격파 및 공격 후 밀치기
                    const attackRadius = isBuffed ? 210 : 160;
                    const attackDmg = isBuffed ? 125 : 82;
                    const knockbackPwr = isBuffed ? 30 : 22;

                    for (let i = 0; i < 22; i++) {
                        const spd = Math.random() * 8 + 3;
                        const a = (i * Math.PI * 2) / 22;
                        particles.push(new Particle(endX, endY, Math.cos(a) * spd, Math.sin(a) * spd, isBuffed ? '#00e5ff' : '#2979ff', Math.random() * 8 + 4, 20, 'spark'));
                    }
                    addGroundDecal(endX, endY, isBuffed ? 45 : 35, 'crater');

                    // 주변 적 피격 & 밀치기
                    const targets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
                    let hitAny = false;
                    for (const tgt of targets) {
                        if (!tgt || !tgt.isAlive) continue;
                        const d = Math.hypot(tgt.x - endX, tgt.y - endY);
                        if (d <= attackRadius + tgt.radius) {
                            hitAny = true;
                            const kbAngle = Math.atan2(tgt.y - endY, tgt.x - endX);
                            const kbX = Math.cos(kbAngle) * knockbackPwr;
                            const kbY = Math.sin(kbAngle) * knockbackPwr;
                            tgt.takeDamage(attackDmg, this, isBuffed, kbX, kbY);
                            if (isBuffed) {
                                tgt.applySlow(0.30, 60); // 1초간 30% 슬로우
                            }
                        }
                    }

                    if (hitAny) {
                        triggerHitstop(isBuffed ? 8 : 5);
                        triggerScreenShake(isBuffed ? 16 : 10);
                        sfx.playHit();
                        showAlert(isBuffed ? '⚡ 강화 신속 충격 분쇄! (BLOW AWAY!) ⚡' : '⚡ 신속 (EXTREME SPEED) 순간이동 밀치기! ⚡');
                    } else {
                        showAlert('⚡ 신속 (순간이동 이동 완료) ⚡');
                    }

                } else if (slot === 'r') {
                    // R: 뼈다귀 부메랑 (앞쪽으로 뼈다귀 10개를 흩뿌림 -> 적쪽으로 유도 관통 공격 -> 자신에게 돌아옴)
                    this.cooldowns.r = this.maxCooldowns.r;
                    this.boneBoomerangQueue = [];
                    const totalBones = 10;
                    const maxSpread = 0.58;
                    for (let i = 0; i < totalBones; i++) {
                        const spread = -maxSpread + (i / (totalBones - 1)) * (maxSpread * 2);
                        this.boneBoomerangQueue.push({
                            delay: i * 2, // 2프레임 간격 순차 방출
                            angleOffset: spread
                        });
                    }
                    sfx.playBoneBoomerang();
                    showAlert('🪃 뼈다귀 부메랑 (10발 연속 순차 투척)! 🪃');

                } else if (slot === 'f') {
                    // F: 본러시
                    // 1차: 타겟한 곳으로 푸른 뼈다귀를 하나 던지고 적이 맞거나 타겟 위치까지 가면 박힘
                    // 2차: 1번 더 누를 시 그 자리로 순간이동 후 바닥을 내리쳐 공격 후 5초간 손에 뼈다귀가 들려 평타와 신속 강화
                    if (!this.boneRushAnchor) {
                        // 1차 시전: 푸른 뼈다귀 투척
                        const angle = this.aimAngle;
                        const spd = 28;
                        const aiTarget = (this.isAI && this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                        const targetX = this.isAI ? aiTarget.x : mouse.x;
                        const targetY = this.isAI ? aiTarget.y : mouse.y;
                        const distToTarget = Math.min(720, Math.hypot(targetX - this.x, targetY - this.y));

                        projectiles.push(new Projectile({
                            x: this.x + Math.cos(angle) * 32,
                            y: this.y + Math.sin(angle) * 32,
                            vx: Math.cos(angle) * spd,
                            vy: Math.sin(angle) * spd,
                            speed: spd,
                            radius: 20,
                            damage: 40,
                            owner: this,
                            type: 'bone_rush_toss',
                            life: 60,
                            range: distToTarget,
                            piercing: false,
                            knockback: 6
                        }));
                        sfx.playBoneRushToss();
                        showAlert('🦴 본러시 뼈다귀 투척! (맞거나 도달 시 바닥에 박힘) 🦴');
                    } else {
                        // 2차 시전: 박힌 뼈다귀 자리로 순간이동 후 바닥 내리치기!
                        const anchorX = this.boneRushAnchor.x;
                        const anchorY = this.boneRushAnchor.y;

                        for (let i = 0; i < 16; i++) {
                            const spd = Math.random() * 6 + 2;
                            const a = Math.random() * Math.PI * 2;
                            particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#00e5ff', 7, 18, 'spark'));
                        }

                        this.x = anchorX;
                        this.y = anchorY;
                        this.vx = 0;
                        this.vy = 0;

                        const smashRadius = 190;
                        const smashDamage = 125;
                        sfx.playBoneRushSmash();
                        triggerScreenShake(20);
                        triggerHitstop(8);
                        addGroundDecal(anchorX, anchorY, 55, 'crater');
                        addGroundDecal(anchorX, anchorY, 44, 'electric');

                        for (let i = 0; i < 28; i++) {
                            const spd = Math.random() * 9 + 3;
                            const a = Math.random() * Math.PI * 2;
                            particles.push(new Particle(anchorX, anchorY, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.6 ? '#00e5ff' : '#2979ff', Math.random() * 9 + 4, 24, 'spark'));
                        }

                        const targets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
                        for (const tgt of targets) {
                            if (!tgt || !tgt.isAlive) continue;
                            const d = Math.hypot(tgt.x - anchorX, tgt.y - anchorY);
                            if (d <= smashRadius + tgt.radius) {
                                const kbAngle = Math.atan2(tgt.y - anchorY, tgt.x - anchorX);
                                tgt.takeDamage(smashDamage, this, true, Math.cos(kbAngle) * 26, Math.sin(kbAngle) * 26);
                                tgt.applyStun(21); // 0.35초 스턴
                            }
                        }

                        this.boneRushAnchor = null;
                        this.boneRushBuffTimer = 300; // 5초간 버프 지속
                        this.cooldowns.f = this.maxCooldowns.f; // 12초 쿨다운
                        showAlert('💥 본러시 바닥 내리치기 강타 성공! (5초간 평타/신속 강화) 💥');
                    }
                }
            }
        }

        applySlow(amount, duration) {
            this.slowAmount = amount;
            this.slowTimer = duration;
        }

        applyStun(duration) {
            // 경직 / 스턴 (행동 불가)
            if (this.invincibleTimer > 0) return;
            if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') return;
            this.stunTimer = Math.max(this.stunTimer || 0, duration);
            this.state = 'stun';
            this.stateTimer = Math.max(this.stateTimer || 0, duration);
            this.vx *= 0.15;
            this.vy *= 0.15;
            damageTexts.push(new DamageText(this.x, this.y - 28, '⚡ 경직!', '#ffd700', true));
        }

        takeDamage(dmg, attacker, isCrit = false, kbX = 0, kbY = 0, isHazard = false) {
            if (this.invincibleTimer > 0) return;
            this.hp = Math.max(0, this.hp - dmg);
            damageTexts.push(new DamageText(this.x, this.y, `-${Math.round(dmg)}`, isCrit ? '#ff1744' : '#ffeb3b', isCrit));

            // 장판류(불꽃 장판, 씨뿌리기, 오물폭탄) 피해인 경우:
            // 피격 경직(hurt) 및 밀치기(넉백)를 주지 않아 매끄럽게 탈출 가능!
            if (isHazard) {
                if (this.hp <= 0) {
                    this.isAlive = false;
                    showAlert(`${this.name} K.O.!`);
                    showGameOverModal(attacker);
                }
                return;
            }

            // 솔라빔 차징 및 발사 중에는 절대 끊기지 않음 (슈퍼아머 / 무중단!)
            if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') {
                triggerScreenShake(3);
                return;
            }

            if (this.stunTimer > 0) {
                this.state = 'stun';
            } else if (isCrit || Math.hypot(kbX, kbY) > 10) {
                this.state = 'knockdown';
                this.stateTimer = 18;
            } else {
                this.state = 'hurt';
                this.stateTimer = 8;
            }

            this.vx = kbX;
            this.vy = kbY;

            if (this.hp <= 0) {
                this.isAlive = false;
                showAlert(`${this.name} K.O.!`);
                showGameOverModal(attacker);
            }
        }

        updateAI(target, speed) {
            if (!target.isAlive) return;

            const diffConfig = (typeof DIFFICULTY_SETTINGS !== 'undefined' && DIFFICULTY_SETTINGS[currentDifficulty]) 
                ? DIFFICULTY_SETTINGS[currentDifficulty] 
                : { speedMult: 1.12, dodgeChance: 0.88, skillMult: 1.35, canMove: true, canAttack: true };

            if (!diffConfig.canMove && !diffConfig.canAttack) {
                // 샌드백 난이도: 완전 정지 & 피격 전용
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                return;
            }

            const dist = Math.hypot(target.x - this.x, target.y - this.y);
            let angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
            if (diffConfig.aimNoise) {
                angleToTarget += (Math.random() - 0.5) * diffConfig.aimNoise;
            }
            this.aimAngle = angleToTarget;

            // 이동 속도 및 회피율 난이도 배율
            const effectiveSpeed = speed * (diffConfig.speedMult || 1.0);
            let optRange = 360;
            let dodgeChance = diffConfig.dodgeChance;

            if (currentDifficulty === 'hell') {
                // 지옥 난이도: 1000회 훈련된 강화 AI 최대 회피율과 사거리 제어
                const tactic = (typeof aiBrain !== 'undefined') ? aiBrain.tactics[this.species] : null;
                if (tactic) {
                    optRange = tactic.optimalRange;
                    dodgeChance = Math.max(0.85, tactic.dodgeChance);
                }
            } else if (currentDifficulty === 'hard') {
                optRange = (this.species === 'squirtle' ? 370 : (this.species === 'bulbasaur' ? 420 : (this.species === 'scyther' ? 140 : (this.species === 'lucario' ? 220 : 310))));
            } else if (currentDifficulty === 'normal') {
                optRange = (this.species === 'scyther' ? 150 : (this.species === 'lucario' ? 240 : 340));
            } else if (currentDifficulty === 'easy') {
                optRange = 150;
            }

            let moveAngle = angleToTarget;
            if (currentDifficulty === 'easy') {
                moveAngle = (dist > 160) ? angleToTarget : angleToTarget + Math.PI / 2;
            } else {
                if (dist < optRange - 50) {
                    moveAngle = angleToTarget + Math.PI; // 거리 벌리기
                } else if (dist > optRange + 70) {
                    moveAngle = angleToTarget; // 거리 좁히기
                } else {
                    moveAngle = angleToTarget + (Math.PI / 2) * (Math.sin(this.animTick * 0.04) > 0 ? 1 : -1);
                }
            }

            // 적 투사체 회피 기동 (난이도별 회피 확률)
            if (dodgeChance > 0) {
                for (let i = 0; i < projectiles.length; i++) {
                    const proj = projectiles[i];
                    if (proj.owner === target) {
                        const dToProj = Math.hypot(proj.x - this.x, proj.y - this.y);
                        if (dToProj < 240 && Math.random() < dodgeChance) {
                            moveAngle += (Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2);
                            break;
                        }
                    }
                }
            }

            this.vx = Math.cos(moveAngle) * effectiveSpeed;
            this.vy = Math.sin(moveAngle) * effectiveSpeed;
            this.state = 'run';
            this.walkFrame += 0.25;

            // 스킬 시전 확률 배율
            const sm = diffConfig.skillMult !== undefined ? diffConfig.skillMult : 1.0;
            if (sm <= 0) return;

            if (this.species === 'squirtle') {
                if ((target.state === 'charging' || dist < 240) && this.cooldowns.r <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('r');
                } else if (dist < 230 && this.cooldowns.e <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('e');
                } else if (dist >= 220 && dist <= 600 && this.cooldowns.q <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('q');
                } else if (this.cooldowns.f <= 0 && dist >= 200 && dist <= 750 && Math.random() < 0.03 * sm) {
                    this.useSkill('f'); // 200 딜 하이드로펌프
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.07 * sm) {
                    this.useSkill('attack');
                }
            } else if (this.species === 'bulbasaur') {
                if (dist < 220 && this.cooldowns.e <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('e'); // 꽃보라
                } else if (dist >= 200 && dist <= 550 && this.cooldowns.q <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('q'); // 씨뿌리기 (25% 회복 너프)
                } else if (dist >= 240 && dist <= 600 && this.cooldowns.r <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('r'); // 오물폭탄 (슬로우 너프)
                } else if (dist >= 250 && dist <= 750 && this.cooldowns.f <= 0 && Math.random() < 0.02 * sm) {
                    this.useSkill('f'); // 솔라빔 (회전 너프)
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.07 * sm) {
                    this.useSkill('attack');
                }
            } else if (this.species === 'pikachu') {
                if (dist < 200 && this.cooldowns.e <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('e'); // 아이언테일로 날려버림
                } else if (dist >= 200 && dist <= 650 && this.cooldowns.q <= 0 && Math.random() < 0.035 * sm) {
                    this.useSkill('q'); // 전광석화 고속 돌진
                } else if (this.cooldowns.r <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('r'); // 일렉트릭 네트
                } else if (this.cooldowns.f <= 0 && dist >= 160 && dist <= 700 && Math.random() < 0.03 * sm) {
                    this.useSkill('f'); // 지기 궁극기형 번개 (경직 + 조금씩 전진)
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('attack'); // 초고속 백만볼트
                }
            } else if (this.species === 'scyther') {
                if (dist <= 135 && this.cooldowns.r <= 0 && Math.random() < 0.12 * sm) {
                    this.useSkill('r'); // 시저크로스 (명중 시 1초 리셋)
                } else if (dist <= 110 && this.cooldowns.attack <= 0 && Math.random() < 0.15 * sm) {
                    this.useSkill('attack'); // 연속자르기
                } else if (dist >= 180 && dist <= 600 && this.cooldowns.q <= 0 && Math.random() < 0.05 * sm) {
                    this.useSkill('q'); // 유턴 치고 빠지기
                } else if (dist >= 200 && dist <= 650 && this.cooldowns.e <= 0 && Math.random() < 0.04 * sm) {
                    this.useSkill('e'); // 에어커터 5발
                } else if (this.cooldowns.f <= 0 && Math.random() < 0.02 * sm) {
                    this.useSkill('f'); // 그림자 분신술
                }
            } else if (this.species === 'lucario') {
                // 루카리오 AI 행동 패턴
                if (this.boneRushAnchor && Math.random() < 0.25 * sm) {
                    // 본러시 뼈다귀 박혀있으면 2차 시전 (순간이동 강타)
                    this.useSkill('f');
                } else if (dist <= 130 && this.cooldowns.attack <= 0 && Math.random() < 0.18 * sm) {
                    this.useSkill('attack'); // 불릿펀치 (근접)
                } else if (dist >= 180 && dist <= 550 && this.cooldowns.e <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('e'); // 신속 순간이동 밀치기
                } else if (dist >= 160 && dist <= 480 && this.cooldowns.r <= 0 && Math.random() < 0.05 * sm) {
                    this.useSkill('r'); // 뼈다귀 부메랑 10연사
                } else if (this.cooldowns.f <= 0 && !this.boneRushAnchor && dist >= 180 && dist <= 650 && Math.random() < 0.04 * sm) {
                    this.useSkill('f'); // 본러시 투척
                } else if (dist >= 200 && dist <= 620 && this.cooldowns.q <= 0 && Math.random() < 0.05 * sm) {
                    this.useSkill('q'); // 파동탄 유도 저격
                } else if (this.cooldowns.attack <= 0 && dist <= 165 && Math.random() < 0.12 * sm) {
                    this.useSkill('attack');
                }
            } else {
                if (dist > 280 && this.cooldowns.r <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('r');
                } else if (dist < 340 && this.cooldowns.f <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('f');
                } else if (dist < 280 && this.cooldowns.e <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('e');
                } else if (dist >= 200 && dist <= 600 && this.cooldowns.q <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('q');
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('attack');
                }
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            // 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 24, 28, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            let drawX = 0;
            let drawY = 0;
            let rot = 0;

            if (this.attackMotionTimer > 0) {
                const lungeProgress = this.attackMotionTimer / 12;
                drawX += Math.cos(this.aimAngle) * 14 * lungeProgress;
                drawY += Math.sin(this.aimAngle) * 14 * lungeProgress;
            }

            if (this.state === 'hurt') {
                drawX += (Math.random() - 0.5) * 8;
                rot = (Math.random() - 0.5) * 0.3;
            } else if (this.state === 'stun' || this.stunTimer > 0) {
                drawX += (Math.random() - 0.5) * 6;
                rot = (Math.random() - 0.5) * 0.15;
            } else if (this.state === 'knockdown') {
                rot = (this.animTick * 0.4);
            } else if (this.state === 'braking') {
                rot = (this.facingLeft ? 0.35 : -0.35);
            }

            const sheet = spriteSheets[this.species];
            const isSheetReady = sheet && sheet.complete && sheet.naturalWidth > 0;

            const isBulba = (this.species === 'bulbasaur');
            const isPika = (this.species === 'pikachu');
            const isScyther = (this.species === 'scyther');
            const isLucario = (this.species === 'lucario');
            const fw = isBulba ? 40 : (isScyther ? 40 : 32);
            const fh = (isBulba || isPika) ? 40 : ((isScyther || isLucario) ? 48 : 32);
            const maxCols = isBulba ? 6 : 4;
            const destW = isBulba ? 96 : (isScyther ? 110 : (isLucario ? 92 : 84));
            const destH = isBulba ? 96 : (isPika ? 105 : (isScyther ? 132 : (isLucario ? 130 : 84)));
            const destOffX = -destW / 2;
            const destOffY = isBulba ? -50 : (isPika ? -54 : (isScyther ? -64 : (isLucario ? -62 : -46)));

            let angle = this.aimAngle;
            if (angle < 0) angle += Math.PI * 2;
            const slice = Math.PI / 4;
            const sector = Math.floor((angle + slice / 2) / slice) % 8;
            const sectorToRow = [2, 1, 0, 7, 6, 5, 4, 3];
            const row = sectorToRow[sector];

            let col = 0;
            if (this.state === 'run' || this.state === 'sprint') {
                col = Math.floor(this.walkFrame) % maxCols;
            } else {
                col = 0;
            }

            if (this.species === 'squirtle' && (this.state === 'charging' || this.state === 'whirlpool')) {
                if (this.state === 'whirlpool') {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    ctx.globalCompositeOperation = 'lighter';
                    const wpGrad = ctx.createRadialGradient(0, 0, 30, 0, 0, 220);
                    wpGrad.addColorStop(0, 'rgba(0, 229, 255, 0.45)');
                    wpGrad.addColorStop(0.65, 'rgba(0, 180, 240, 0.2)');
                    wpGrad.addColorStop(1, 'rgba(0, 140, 255, 0)');
                    ctx.fillStyle = wpGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, 220, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.65)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 220, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.shellSpinAngle);

                ctx.fillStyle = '#8d6e63';
                ctx.beginPath();
                ctx.arc(0, 0, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                ctx.strokeStyle = '#4e342e';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
                ctx.moveTo(0, -14); ctx.lineTo(0, 14);
                ctx.stroke();
                ctx.restore();

            } else if (this.species === 'charmander' && this.state === 'charging') {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.chargeAngle * (this.facingLeft ? -0.25 : 0.25));

                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'bulbasaur' && this.state === 'petal_blizzard') {
                // 꽃보라 시전 중 전방위 회전 이펙트
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.globalCompositeOperation = 'lighter';
                const pGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 220);
                pGrad.addColorStop(0, 'rgba(255, 128, 171, 0.55)');
                pGrad.addColorStop(0.7, 'rgba(244, 143, 177, 0.2)');
                pGrad.addColorStop(1, 'rgba(244, 143, 177, 0)');
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 220, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 128, 171, 0.7)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 220, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.translate(drawX, drawY);
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'bulbasaur' && (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire')) {
                // 솔라빔 차징 및 발사 오라
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.globalCompositeOperation = 'lighter';

                const auraRadius = (this.state === 'solarbeam_charge') ? (25 + Math.sin(this.animTick * 0.3) * 8) : 48;
                const auraGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, auraRadius);
                auraGrad.addColorStop(0, '#ffffff');
                auraGrad.addColorStop(0.5, '#ffff00');
                auraGrad.addColorStop(1, 'rgba(118, 255, 3, 0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(0, 0, auraRadius, 0, Math.PI * 2);
                ctx.fill();

                // 조준 가이드 레이저 선 (차징 중에 방향 표시)
                if (this.state === 'solarbeam_charge') {
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.65)';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(this.aimAngle) * 800, Math.sin(this.aimAngle) * 800);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.restore();

                // 발사 중 전방 거대 솔라빔 드로잉
                if (this.state === 'solarbeam_fire') {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    ctx.rotate(this.aimAngle);
                    ctx.globalCompositeOperation = 'lighter';

                    const beamLen = 1300;
                    const bWidth = 65;
                    const beamGrad = ctx.createLinearGradient(0, -bWidth / 2, 0, bWidth / 2);
                    beamGrad.addColorStop(0, 'rgba(118, 255, 3, 0)');
                    beamGrad.addColorStop(0.2, '#ffff00');
                    beamGrad.addColorStop(0.5, '#ffffff');
                    beamGrad.addColorStop(0.8, '#ffff00');
                    beamGrad.addColorStop(1, 'rgba(118, 255, 3, 0)');
                    ctx.fillStyle = beamGrad;
                    ctx.fillRect(10, -bWidth / 2, beamLen, bWidth);

                    // 중심 코어 레이저
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(10, -bWidth * 0.2, beamLen, bWidth * 0.4);

                    ctx.restore();
                }

                ctx.save();
                ctx.translate(drawX, drawY);
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'pikachu' && this.state === 'quick_attack') {
                // 전광석화 돌진 아우라 및 스피드라인
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.chargeAngle * (this.facingLeft ? -0.2 : 0.2));

                ctx.globalCompositeOperation = 'lighter';
                const qGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 52);
                qGrad.addColorStop(0, '#ffffff');
                qGrad.addColorStop(0.4, '#fff59d');
                qGrad.addColorStop(0.8, 'rgba(0, 229, 255, 0.4)');
                qGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = qGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 52, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalCompositeOperation = 'source-over';
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'pikachu' && this.state === 'iron_tail') {
                // 아이언테일 넓은 부채꼴 메탈릭 슬래시 이펙트
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.aimAngle);

                const sweepRadius = 195;
                const sweepAngle = Math.PI * 0.78; // 140도

                ctx.globalCompositeOperation = 'lighter';
                const tailGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, sweepRadius);
                tailGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
                tailGrad.addColorStop(0.4, 'rgba(207, 216, 220, 0.6)');
                tailGrad.addColorStop(0.75, 'rgba(255, 235, 59, 0.45)');
                tailGrad.addColorStop(1, 'rgba(255, 235, 59, 0)');

                ctx.fillStyle = tailGrad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, sweepRadius, -sweepAngle / 2, sweepAngle / 2);
                ctx.closePath();
                ctx.fill();

                // 메탈릭 슬래시 테두리 호
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, sweepRadius, -sweepAngle / 2, sweepAngle / 2);
                ctx.stroke();

                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, sweepRadius - 8, -sweepAngle / 2, sweepAngle / 2);
                ctx.stroke();

                ctx.restore();

                // 본체 회전 모션
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(rot + (this.ironTailTimer / 16) * Math.PI * 2 * (this.facingLeft ? -1 : 1));
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(rot);

                if (this.state === 'hurt' && Math.floor(this.animTick / 3) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }

                ctx.restore();
            }

            // 경직 (스턴) 상태 시각 효과
            if (this.stunTimer > 0 || this.state === 'stun') {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
                ctx.stroke();

                ctx.font = '8px "Press Start 2P", monospace';
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ STUN (경직) ⚡', 0, -this.radius - 24);
                ctx.restore();
            }

            if (this.species === 'charmander') {
                const tailX = (this.facingLeft ? 22 : -22) + this.x;
                const tailY = 8 + this.y;
                particles.push(new Particle(tailX, tailY, (Math.random() - 0.5) * 1.5, -Math.random() * 2 - 1, Math.random() < 0.6 ? '#ff3d00' : '#ffea00', Math.random() * 5 + 3, 14, 'flame'));
            } else if (this.species === 'pikachu' && Math.random() < 0.3) {
                // 피카츄 볼 전기 주머니 스파크 방출
                const cheekX = (this.facingLeft ? -10 : 10) + this.x + (Math.random() - 0.5) * 8;
                const cheekY = -6 + this.y + (Math.random() - 0.5) * 6;
                particles.push(new Particle(cheekX, cheekY, (Math.random() - 0.5) * 1.5, -Math.random() * 1.5, Math.random() < 0.6 ? '#ffea00' : '#00e5ff', Math.random() * 4 + 2, 12, 'spark'));
            }

            // 루카리오: 바닥에 박힌 뼈다귀 앵커 렌더링
            if (this.boneRushAnchor) {
                const anc = this.boneRushAnchor;
                ctx.save();
                ctx.translate(anc.x, anc.y);
                ctx.globalCompositeOperation = 'lighter';

                const pulseR = 24 + Math.sin(this.animTick * 0.15) * 6;
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
                ctx.stroke();

                ctx.rotate(-Math.PI / 4);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(-22, -4, 44, 8, 4);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-22, -5, 5, 0, Math.PI * 2);
                ctx.arc(-22, 5, 5, 0, Math.PI * 2);
                ctx.arc(22, -5, 5, 0, Math.PI * 2);
                ctx.arc(22, 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // 루카리오: 본러시 버프 손에 든 푸른 뼈다귀 무기 렌더링 (5초간 평타/신속 강화)
            if (this.species === 'lucario' && this.boneRushBuffTimer > 0) {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.aimAngle);
                ctx.globalCompositeOperation = 'lighter';

                const boneLen = 42;
                ctx.fillStyle = '#e0f7fa';
                ctx.beginPath();
                ctx.roundRect(14, -boneLen / 2, 7, boneLen, 3);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(17, -boneLen / 2, 5, 0, Math.PI * 2);
                ctx.arc(17, boneLen / 2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                const bGrad = ctx.createRadialGradient(17, 0, 4, 17, 0, 32);
                bGrad.addColorStop(0, 'rgba(0, 229, 255, 0.6)');
                bGrad.addColorStop(1, 'rgba(41, 121, 255, 0)');
                ctx.fillStyle = bGrad;
                ctx.beginPath();
                ctx.arc(17, 0, 32, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            ctx.restore();
        }

        drawFallbackPixel(ctx) {
            if (this.species === 'charmander') {
                ctx.fillStyle = '#ff7043';
                ctx.fillRect(-20, -30, 40, 50);
                ctx.fillStyle = '#fff59d';
                ctx.fillRect(-10, -10, 20, 25);
            } else if (this.species === 'squirtle') {
                ctx.fillStyle = '#81d4fa';
                ctx.fillRect(-20, -30, 40, 50);
                ctx.fillStyle = '#ffe082';
                ctx.fillRect(-12, -12, 24, 26);
            } else if (this.species === 'bulbasaur') {
                ctx.fillStyle = '#4db6ac';
                ctx.fillRect(-22, -26, 44, 46);
                ctx.fillStyle = '#2e7d32'; // 등 꽃봉오리
                ctx.fillRect(-14, -36, 28, 16);
                ctx.fillStyle = '#d32f2f'; // 붉은 눈
                ctx.fillRect(-12, -16, 6, 8);
                ctx.fillRect(6, -16, 6, 8);
            } else if (this.species === 'pikachu') {
                // 피카츄 귀여운 도트 폴백 그래픽
                ctx.fillStyle = '#ffd600';
                ctx.fillRect(-18, -26, 36, 46);
                // 양쪽 뾰족한 귀
                ctx.beginPath();
                ctx.moveTo(-16, -26); ctx.lineTo(-24, -48); ctx.lineTo(-8, -26);
                ctx.moveTo(16, -26); ctx.lineTo(24, -48); ctx.lineTo(8, -26);
                ctx.fill();
                // 귀 끝 검정
                ctx.fillStyle = '#212121';
                ctx.beginPath();
                ctx.moveTo(-18, -38); ctx.lineTo(-24, -48); ctx.lineTo(-12, -38);
                ctx.moveTo(18, -38); ctx.lineTo(24, -48); ctx.lineTo(12, -38);
                ctx.fill();
                // 눈
                ctx.fillStyle = '#212121';
                ctx.fillRect(-12, -18, 6, 7);
                ctx.fillRect(6, -18, 6, 7);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-11, -17, 2, 2);
                ctx.fillRect(7, -17, 2, 2);
                // 빨간 볼 (전기 주머니)
                ctx.fillStyle = '#f44336';
                ctx.fillRect(-16, -10, 6, 6);
                ctx.fillRect(10, -10, 6, 6);
                // 번개 모양 꼬리
                ctx.fillStyle = '#ffd600';
                ctx.strokeStyle = '#ffd600';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(14, 6); ctx.lineTo(26, -4); ctx.lineTo(22, 2); ctx.lineTo(34, -8);
                ctx.stroke();
            } else if (this.species === 'scyther') {
                // 스라크 사마귀 픽셀 도트
                ctx.fillStyle = '#66bb6a';
                ctx.fillRect(-16, -30, 32, 48);
                // 복부
                ctx.fillStyle = '#c8e6c9';
                ctx.fillRect(-10, -10, 20, 24);
                // 머리 & 뿔
                ctx.fillStyle = '#43a047';
                ctx.beginPath();
                ctx.moveTo(-14, -30); ctx.lineTo(0, -48); ctx.lineTo(14, -30);
                ctx.fill();
                // 등 날개 (반투명 곤충 날개)
                ctx.fillStyle = 'rgba(224, 247, 250, 0.7)';
                ctx.beginPath();
                ctx.ellipse(-18, -16, 18, 6, -Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(18, -16, 18, 6, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                // 양손 낫 (Dual scythes)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(-22, -6, 18, -Math.PI / 2, Math.PI / 3);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(22, -6, 18, Math.PI * 0.65, Math.PI * 1.5);
                ctx.stroke();
            } else if (this.species === 'lucario') {
                // 루카리오 자칼 파이터 도트 폴백
                ctx.fillStyle = '#1e88e5';
                ctx.fillRect(-16, -30, 32, 48);
                // 가슴 크림색 털
                ctx.fillStyle = '#fff9c4';
                ctx.fillRect(-10, -22, 20, 18);
                // 가슴 가시
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(0, -22); ctx.lineTo(6, -16); ctx.lineTo(-6, -16);
                ctx.fill();
                // 검은 마스크 및 귀
                ctx.fillStyle = '#212121';
                ctx.fillRect(-14, -38, 28, 14);
                ctx.beginPath();
                ctx.moveTo(-14, -38); ctx.lineTo(-18, -54); ctx.lineTo(-8, -38);
                ctx.moveTo(14, -38); ctx.lineTo(18, -54); ctx.lineTo(8, -38);
                ctx.fill();
                // 붉은 눈
                ctx.fillStyle = '#d50000';
                ctx.fillRect(-9, -32, 4, 5);
                ctx.fillRect(5, -32, 4, 5);

                if (this.boneRushBuffTimer > 0) {
                    ctx.strokeStyle = '#00e5ff';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(18, -12); ctx.lineTo(28, 16);
                    ctx.stroke();
                }
            }
        }
    }

    // --- 초대형 포켓몬 리그 공식 스타디움 전면 필드 드로잉 (3000 x 1900 월드) ---
    function drawPokemonStadium(ctx) {
        ctx.save();

        // 1. 경기장 바깥 어두운 관람석 베이스
        ctx.fillStyle = '#080d15';
        ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        // 2. 상단 및 측면 관람석
        const bleacherRows = [
            { y: 0, h: 36, color: '#0f1624' },
            { y: 36, h: 36, color: '#162134' },
            { y: 72, h: 36, color: '#1e2c45' },
            { y: 108, h: 34, color: '#273856' }
        ];
        for (const row of bleacherRows) {
            ctx.fillStyle = row.color;
            ctx.fillRect(0, row.y, WORLD_WIDTH, row.h);
        }

        // 응원하는 열광적인 관중 픽셀 도트
        const crowdColors = ['#ff5252', '#448aff', '#ffd740', '#69f0ae', '#e040fb', '#ffffff', '#ffab40', '#00e5ff'];
        const crowdAnim = Math.sin(Date.now() * 0.006);
        for (let x = 20; x < WORLD_WIDTH - 20; x += 16) {
            for (let r = 0; r < 4; r++) {
                const seed = (x * 17 + r * 31) % crowdColors.length;
                const bob = ((x + r * 7) % 3 === 0) ? crowdAnim * 2.5 : 0;
                ctx.fillStyle = crowdColors[seed];
                ctx.fillRect(x, 6 + r * 32 + bob, 7, 7);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fillRect(x + 1, 14 + r * 32 + bob, 5, 8);
            }
        }

        // 3. 스타디움 외곽 석조 방벽 테두리
        ctx.fillStyle = '#222c3d';
        ctx.fillRect(130, 142, WORLD_WIDTH - 260, WORLD_HEIGHT - 284);
        ctx.strokeStyle = '#41526d';
        ctx.lineWidth = 8;
        ctx.strokeRect(130, 142, WORLD_WIDTH - 260, WORLD_HEIGHT - 284);

        // 상단 방벽 공식 챔피언십 엠블럼 띠
        ctx.fillStyle = '#18212f';
        ctx.fillRect(130, 142, WORLD_WIDTH - 260, 26);
        ctx.fillStyle = '#fbc02d';
        ctx.font = '900 13px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('★ POKÉMON LEAGUE OFFICIAL CHAMPIONSHIP ARENA ★', CENTER_X, 160);

        // 4. 내부 흙/모래 트랙 띠
        ctx.fillStyle = '#b3823e';
        ctx.fillRect(165, 172, WORLD_WIDTH - 330, WORLD_HEIGHT - 344);
        ctx.strokeStyle = '#8d6326';
        ctx.lineWidth = 5;
        ctx.strokeRect(165, 172, WORLD_WIDTH - 330, WORLD_HEIGHT - 344);

        // 5. 메인 천연 잔디 배틀 피치
        const pitchX = PITCH_X;
        const pitchY = PITCH_Y;
        const pitchW = PITCH_W;
        const pitchH = PITCH_H;

        const grassGrad = ctx.createRadialGradient(CENTER_X, CENTER_Y, 150, CENTER_X, CENTER_Y, 1400);
        grassGrad.addColorStop(0, '#388e3c');
        grassGrad.addColorStop(0.65, '#2e7d32');
        grassGrad.addColorStop(1, '#1b5e20');
        ctx.fillStyle = grassGrad;
        ctx.fillRect(pitchX, pitchY, pitchW, pitchH);

        // 잔디 스트라이프 패턴
        ctx.save();
        ctx.beginPath();
        ctx.rect(pitchX, pitchY, pitchW, pitchH);
        ctx.clip();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (let x = pitchX; x < pitchX + pitchW; x += 100) {
            ctx.fillRect(x, pitchY, 50, pitchH);
        }

        // 지형 데칼 (Scorch, Water, Crater, Skid, Sludge)
        drawGroundDecals(ctx);

        // 6. 공식 규격 코트 흰색 라인
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 4;
        ctx.strokeRect(pitchX + 40, pitchY + 40, pitchW - 80, pitchH - 80);

        // 중앙 분할선
        ctx.beginPath();
        ctx.moveTo(CENTER_X, pitchY + 40);
        ctx.lineTo(CENTER_X, pitchY + pitchH - 40);
        ctx.stroke();

        // 중앙 대형 서클
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, 200, 0, Math.PI * 2);
        ctx.stroke();

        // 7. 트레이너 스타트 박스 (1P 레드 / 2P 블루)
        ctx.fillStyle = 'rgba(244, 67, 54, 0.22)';

        ctx.textAlign = 'center';
        ctx.fillText('2P', pitchX + pitchW - 130, CENTER_Y + 8);

        ctx.restore();

        // 8. 중앙 몬스터볼 문양
        ctx.save();
        const pbRadius = 130;
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, pbRadius, Math.PI, 0);
        ctx.fillStyle = '#d32f2f';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, pbRadius * 0.72, Math.PI * 1.1, Math.PI * 1.45);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 8;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, pbRadius, 0, Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.fillStyle = '#1e272e';
        ctx.fillRect(CENTER_X - pbRadius, CENTER_Y - 12, pbRadius * 2, 24);

        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(CENTER_X, CENTER_Y, pbRadius, 0, Math.PI * 2);

        // 9. 코너 4개소 스타디움 조명 빛줄기
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const corners = [
            { x: pitchX, y: pitchY },
            { x: pitchX + pitchW, y: pitchY },
            { x: pitchX, y: pitchY + pitchH },
            { x: pitchX + pitchW, y: pitchY + pitchH }
        ];
        for (const c of corners) {
            const grad = ctx.createRadialGradient(c.x, c.y, 40, c.x, c.y, 650);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.18)');

    // --- 화면 밖 적 방향 화살표 인디케이터 (오프스크린 인디케이터) ---
    function drawOffscreenIndicator(ctx, target) {
        if (!target || !target.isAlive) return;

        const sx = target.x - camera.x;
        const sy = target.y - camera.y;

        const marginInside = 50;
        if (sx >= marginInside && sx <= VIEW_WIDTH - marginInside &&
            sy >= marginInside && sy <= VIEW_HEIGHT - marginInside) {
            return;
        }

        const cx = VIEW_WIDTH / 2;
        const cy = VIEW_HEIGHT / 2;
        const angle = Math.atan2(sy - cy, sx - cx);

        const padX = 45;
        const padYTop = 85;
        const padYBottom = 70;
        const minX = padX;
        const maxX = VIEW_WIDTH - padX;
        const minY = padYTop;
        const maxY = VIEW_HEIGHT - padYBottom;

        let ix, iy;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        if (cos > 0) {
            ix = maxX;
            iy = cy + (maxX - cx) * Math.tan(angle);
        } else {
            ix = minX;
            iy = cy + (minX - cx) * Math.tan(angle);
        }

        if (iy < minY) {
            iy = minY;
            ix = cx + (minY - cy) / Math.tan(angle);
        } else if (iy > maxY) {
            iy = maxY;
            ix = cx + (maxY - cy) / Math.tan(angle);
        }

        const dist = Math.hypot(target.x - p1.x, target.y - p1.y);
        const distMeter = Math.round(dist / 20);

        const colorMain = (target.species === 'charmander') ? '#ff5722' : (target.species === 'squirtle' ? '#00e5ff' : (target.species === 'bulbasaur' ? '#00e676' : '#ffd700'));

        ctx.save();
        ctx.translate(ix, iy);

        const pulse = 1 + Math.sin(Date.now() * 0.009) * 0.14;

        // 1. 도트 화살표
        ctx.save();
        ctx.rotate(angle);
        ctx.scale(pulse, pulse);

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(22, 0);
        ctx.lineTo(-14, -18);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-14, 18);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = colorMain;
        ctx.beginPath();
        ctx.moveTo(17, 0);
        ctx.lineTo(-10, -13);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-10, 13);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 2. 적 정보 도트 배지
        const badgeDist = 42;
        const badgeX = -Math.cos(angle) * badgeDist;
        const badgeY = -Math.sin(angle) * badgeDist;

        ctx.save();
        ctx.translate(badgeX, badgeY);

        const boxW = 88;
        const boxH = 36;
        ctx.fillStyle = 'rgba(11, 16, 25, 0.94)';
        ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);
        ctx.strokeStyle = colorMain;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-boxW / 2 - 2, -boxH / 2 - 2, 4, 4);
        ctx.fillRect(boxW / 2 - 2, -boxH / 2 - 2, 4, 4);
        ctx.fillRect(-boxW / 2 - 2, boxH / 2 - 2, 4, 4);
        ctx.fillRect(boxW / 2 - 2, boxH / 2 - 2, 4, 4);

        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = colorMain;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(target.name, 0, -6);

        ctx.font = '7.5px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`${distMeter}m ◀`, 0, 8);

        ctx.restore();
        ctx.restore();
    }

    // --- 전체 경기장 도트 미니맵 레이더 HUD ---
    function drawMiniMap(ctx) {

        ctx.fillStyle = '#2e7d32';

        ctx.strokeRect(offsetX + PITCH_X * scaleX, offsetY + PITCH_Y * scaleY, PITCH_W * scaleX, PITCH_H * scaleY);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(offsetX + CENTER_X * scaleX, offsetY + CENTER_Y * scaleY, 4, 0, Math.PI * 2);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(offsetX + camera.x * scaleX, offsetY + camera.y * scaleY, VIEW_WIDTH * scaleX, VIEW_HEIGHT * scaleY);

            ctx.fillRect(offsetX + p2.x * scaleX - 3, offsetY + p2.y * scaleY - 3, 6, 6);
        }

        ctx.restore();
    }

    function chooseHeroForAI(oppHero, epsilon = 0.2) {
        if (Math.random() < epsilon) {
            return heroList[Math.floor(Math.random() * heroList.length)];
        }
        let bestHero = heroList[0];
        let bestVal = -Infinity;
        for (const hero of heroList) {
            const val = oppHero ? aiBrain.qSelect[hero][oppHero] : Object.values(aiBrain.qSelect[hero]).reduce((a, b) => a + b, 0) / 4;
            if (val > bestVal) {
                bestVal = val;
                bestHero = hero;
            }
        }
        return bestHero;
    }

    // 초고속 헤드리스 단일 매치 시뮬레이션
    function simulateHeadlessMatch(hero1, hero2) {
        let f1 = {
            species: hero1, hp: 1000, x: 900, y: 950,
            cooldowns: { attack: 0, q: 0, e: 0, r: 0, f: 0 },
            stunTimer: 0
        };
        let f2 = {
            species: hero2, hp: 1000, x: 2100, y: 950,
            cooldowns: { attack: 0, q: 0, e: 0, r: 0, f: 0 },
            stunTimer: 0
        };
        const projs = [];
        const maxTicks = 1000;

        for (let t = 0; t < maxTicks; t++) {
            if (f1.hp <= 0 || f2.hp <= 0) break;

            for (const k in f1.cooldowns) if (f1.cooldowns[k] > 0) f1.cooldowns[k] -= 1/60;
            for (const k in f2.cooldowns) if (f2.cooldowns[k] > 0) f2.cooldowns[k] -= 1/60;
            if (f1.stunTimer > 0) f1.stunTimer--;
            if (f2.stunTimer > 0) f2.stunTimer--;

            const dist = Math.hypot(f2.x - f1.x, f2.y - f1.y);
            const angToF2 = Math.atan2(f2.y - f1.y, f2.x - f1.x);
            const angToF1 = Math.atan2(f1.y - f2.y, f1.x - f2.x);

            // F1 이동
            if (f1.stunTimer <= 0) {
                const opt1 = aiBrain.tactics[f1.species].optimalRange;
                let move1 = angToF2;
                if (dist < opt1 - 40) move1 += Math.PI;
                else if (dist > opt1 + 60) move1 = angToF2;
                else move1 += (Math.PI / 2) * (Math.sin(t * 0.05) > 0 ? 1 : -1);
                f1.x = Math.max(300, Math.min(2700, f1.x + Math.cos(move1) * 5.4));
                f1.y = Math.max(300, Math.min(1600, f1.y + Math.sin(move1) * 5.4));
            }
            // F2 이동
            if (f2.stunTimer <= 0) {
                const opt2 = aiBrain.tactics[f2.species].optimalRange;
                let move2 = angToF1;
                if (dist < opt2 - 40) move2 += Math.PI;
                else if (dist > opt2 + 60) move2 = angToF1;
                else move2 += (Math.PI / 2) * (Math.sin(t * 0.05 + 1) > 0 ? 1 : -1);
                f2.x = Math.max(300, Math.min(2700, f2.x + Math.cos(move2) * 5.4));
                f2.y = Math.max(300, Math.min(1600, f2.y + Math.sin(move2) * 5.4));
            }

            // F1 / F2 스킬 시전
            if (f1.stunTimer <= 0) simCastSkills(f1, f2, dist, angToF2, projs);
            if (f2.stunTimer <= 0) simCastSkills(f2, f1, dist, angToF1, projs);

            // 투사체 이동 및 충돌
            for (let i = projs.length - 1; i >= 0; i--) {
                const p = projs[i];
                p.life--;
                p.x += p.vx;
                p.y += p.vy;

                const target = (p.owner === f1) ? f2 : f1;
                if (Math.hypot(target.x - p.x, target.y - p.y) <= p.radius + 28) {
                    // 학습된 회피 기동 (Dodge / Evasion)
                    const targetTactic = aiBrain.tactics[target.species];
                    const dodgeProb = (targetTactic ? targetTactic.dodgeChance : 0.4) * 0.68;
                    if (Math.random() < dodgeProb) {
                        // 회피 기동 성공: 비관통 투사체는 빗나가 소멸
                        if (!p.piercing) {
                            projs.splice(i, 1);
                            continue;
                        }
                    }

                    target.hp = Math.max(0, target.hp - p.damage);
                    if (p.stun > 0) target.stunTimer = Math.max(target.stunTimer, p.stun);
                    if (p.healRate > 0 && p.owner.hp > 0) {
                        p.owner.hp = Math.min(1000, p.owner.hp + p.damage * p.healRate);
                    }
                    if (!p.piercing) {
                        projs.splice(i, 1);
                        continue;
                    }
                }
                if (p.life <= 0) projs.splice(i, 1);
            }
        }

        let winner = f1.hp > f2.hp ? f1 : f2;
        let loser = f1.hp > f2.hp ? f2 : f1;
        let winnerHp = Math.max(0, winner.hp);

        // 점수 공식: 지면 0점, 이겼을 때 체력이 1000이면 100점, 체력 10 깎일 때마다 -1점
        const lostHp = Math.max(0, 1000 - winnerHp);
        const score = Math.max(0, 100 - Math.floor(lostHp / 10));

        return {
            winnerSpecies: winner.species,
            loserSpecies: loser.species,
            winnerHp: winnerHp,
            score: score
        };
    }

    function simCastSkills(attacker, target, dist, aimAngle, projs) {
        const s = attacker.species;
        if (s === 'charmander') {
            if (dist < 320 && attacker.cooldowns.f <= 0) {
                attacker.cooldowns.f = 11.0;
                target.hp = Math.max(0, target.hp - 96);
            } else if (dist >= 200 && dist <= 550 && attacker.cooldowns.q <= 0) {
                attacker.cooldowns.q = 5.5;
                target.hp = Math.max(0, target.hp - 120);
            } else if (dist >= 220 && dist <= 600 && attacker.cooldowns.r <= 0) {
                attacker.cooldowns.r = 8.5;
                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*17, vy: Math.sin(aimAngle)*17, radius: 28, damage: 90, owner: attacker, life: 60, piercing: false });
            } else if (attacker.cooldowns.attack <= 0) {
                attacker.cooldowns.attack = 0.32;
                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*26, vy: Math.sin(aimAngle)*26, radius: 15, damage: 45, owner: attacker, life: 35, piercing: false });
            }
        } else if (s === 'squirtle') {
            if (dist >= 180 && dist <= 650 && attacker.cooldowns.f <= 0) {
                attacker.cooldowns.f = 11.0;
                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*34, vy: Math.sin(aimAngle)*34, radius: 34, damage: 200, owner: attacker, life: 40, piercing: true });
            } else if (dist < 220 && attacker.cooldowns.e <= 0) {
                attacker.cooldowns.e = 6.5;
                target.hp = Math.max(0, target.hp - 70);
            } else if (attacker.cooldowns.r <= 0 && dist < 280) {
                attacker.cooldowns.r = 8.5;
            } else if (attacker.cooldowns.attack <= 0) {
                attacker.cooldowns.attack = 0.32;
                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*27, vy: Math.sin(aimAngle)*27, radius: 14, damage: 45, owner: attacker, life: 35, piercing: false });
            }
        } else if (s === 'bulbasaur') {
            if (dist >= 250 && dist <= 750 && attacker.cooldowns.f <= 0) {
                attacker.cooldowns.f = 11.0;
                target.hp = Math.max(0, target.hp - 150);
            } else if (dist >= 180 && dist <= 550 && attacker.cooldowns.q <= 0) {

    let isTrainingInProgress = false;

    function run1000TrainingSessions() {
        if (isTrainingInProgress) return;
        isTrainingInProgress = true;

        const totalEpisodes = 1000;
        let currentEpisode = 0;
        const batchSize = 50;

        const progressFill = document.getElementById('train-progress-fill');
        const counterText = document.getElementById('train-counter-text');
        const statusText = document.getElementById('train-status-text');
        const runBtn = document.getElementById('btn-run-1000');
        runBtn.disabled = true;
        runBtn.innerText = '⏳ 훈련 연산 진행 중...';

        for (const h of heroList) {
            aiBrain.stats[h] = { picks: 0, wins: 0, scoreSum: 0 };
            aiBrain.tactics[h].dodgeChance = (h === 'scyther') ? 0.48 : ((h === 'lucario') ? 0.45 : ((h === 'pikachu') ? 0.42 : 0.38));
        }
        let initialScores = [];
        let finalScores = [];

        function processBatch() {
            const endBatch = Math.min(totalEpisodes, currentEpisode + batchSize);

            for (; currentEpisode < endBatch; currentEpisode++) {
                const epsilon = Math.max(0.05, 0.90 - (currentEpisode / 700));

                const heroA = chooseHeroForAI(null, epsilon);
                const heroB = chooseHeroForAI(heroA, epsilon);

                aiBrain.stats[heroA].picks++;
                aiBrain.stats[heroB].picks++;

                const res = simulateHeadlessMatch(heroA, heroB);

                aiBrain.stats[res.winnerSpecies].wins++;
                aiBrain.stats[res.winnerSpecies].scoreSum += res.score;

                if (currentEpisode < 100) initialScores.push(res.score);
                if (currentEpisode >= 900) finalScores.push(res.score);

                const alpha = 0.18;
                aiBrain.qSelect[res.winnerSpecies][res.loserSpecies] += alpha * (res.score - aiBrain.qSelect[res.winnerSpecies][res.loserSpecies]);
                aiBrain.qSelect[res.loserSpecies][res.winnerSpecies] += alpha * (0 - aiBrain.qSelect[res.loserSpecies][res.winnerSpecies]);

                // 승리 포켓몬의 전술 및 회피 기동 강화 (점수 극대화 유도)
                const tactic = aiBrain.tactics[res.winnerSpecies];
                tactic.dodgeChance = Math.min(0.88, tactic.dodgeChance + 0.0006);
            }

            const pct = Math.round((currentEpisode / totalEpisodes) * 100);
            if (progressFill) progressFill.style.width = `${pct}%`;
            if (counterText) counterText.innerText = `${currentEpisode} / ${totalEpisodes} (${pct}%)`;
            if (statusText) statusText.innerText = `훈련 진행 중: 에피소드 ${currentEpisode}회 완료...`;

            if (currentEpisode < totalEpisodes) {
                setTimeout(processBatch, 15);
            } else {
                aiBrain.isTrained = true;
                aiBrain.totalBattles += 1000;
                trainedAiActive = true;
                isTrainingInProgress = false;

                const initAvg = Math.max(1, Math.round(initialScores.reduce((a, b) => a + b, 0) / Math.max(1, initialScores.length)));
                const finalAvg = Math.round(finalScores.reduce((a, b) => a + b, 0) / Math.max(1, finalScores.length));
                aiBrain.initialAvgScore = initAvg;
                aiBrain.finalAvgScore = finalAvg;

                const scoreDiff = finalAvg - initAvg;
                document.getElementById('metric-initial-score').innerText = `${initAvg} 점`;
                document.getElementById('metric-final-score').innerText = `${finalAvg} 점`;
                document.getElementById('metric-score-diff').innerText = scoreDiff >= 0 ? `+${scoreDiff}점 상승! (대폭 강화)` : `${scoreDiff}점`;
                document.getElementById('metric-score-diff').style.color = scoreDiff >= 0 ? '#00e676' : '#ff5252';

                let bestHero = heroList[0];
                let bestScoreAvg = -1;
                for (const h of heroList) {
                    const avg = aiBrain.stats[h].wins > 0 ? (aiBrain.stats[h].scoreSum / aiBrain.stats[h].wins) : 0;
                    if (avg > bestScoreAvg) {
                        bestScoreAvg = avg;
                        bestHero = h;
                    }
                }
                const winRate = Math.round((aiBrain.stats[bestHero].wins / Math.max(1, aiBrain.stats[bestHero].picks)) * 100);
                document.getElementById('metric-best-hero').innerText = getPokemonName(bestHero);
                document.getElementById('metric-best-winrate').innerText = `승률 ${winRate}% (평균 ${Math.round(bestScoreAvg)}점)`;

                updateTrainingStatsTable();

                statusText.innerText = `🎉 1,000회 강화 훈련 완료! AI가 최고 점수 전술을 완벽 습득했습니다.`;
                runBtn.disabled = false;
                runBtn.innerText = '↺ 1,000회 재훈련 (추가 강화)';
                showAlert('🧠 AI 1,000회 강화학습 완료! 인게임 AI에 전술 적용됨.');
                updateHudSkillInfo();
            }
        }

        processBatch();
    }

    function gameLoop() {
        requestAnimationFrame(gameLoop);

        // 배속(1x, 2x, 5x, 10x) 처리
        for (let step = 0; step < gameSpeed; step++) {
            if (hitstopTimer > 0) {
                hitstopTimer--;
                break;
            }

            p1.update(p2);
            p2.update(p1);

            for (let i = scytherClones.length - 1; i >= 0; i--) {
                const clone = scytherClones[i];
                clone.update();
                if (!clone.isAlive) scytherClones.splice(i, 1);
            }

            camera.update(p1);

            updateGroundDecals();

            const arenaTargets = [p1, p2, ...scytherClones];

            for (let i = groundEffects.length - 1; i >= 0; i--) {
                const gf = groundEffects[i];
                gf.update(arenaTargets);
                if (gf.duration <= 0) groundEffects.splice(i, 1);
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.update(arenaTargets, projectiles);
                if (proj.life <= 0) projectiles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.update();
                if (pt.life <= 0) particles.splice(i, 1);
            }

            for (let i = damageTexts.length - 1; i >= 0; i--) {
                const dt = damageTexts[i];
                dt.update();
                if (dt.life <= 0) damageTexts.splice(i, 1);
            }
        }

        mouse.x = screenMouse.x + camera.x;
        mouse.y = screenMouse.y + camera.y;

        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        if (cameraShake.intensity > 0) {
            shakeOffsetX = (Math.random() - 0.5) * cameraShake.intensity;
            shakeOffsetY = (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.intensity *= 0.88;
            if (cameraShake.intensity < 0.2) cameraShake.intensity = 0;
        }

        renderHUD();

        ctx.clearRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

        // === 월드 공간 렌더링 ===
        ctx.save();
        ctx.translate(-camera.x + shakeOffsetX, -camera.y + shakeOffsetY);

        // 1. 경기장
        drawPokemonStadium(ctx);

        // 2. 바닥 장판
        for (const gf of groundEffects) gf.draw(ctx);

        // 3. 투사체
        for (const proj of projectiles) proj.draw(ctx);

        // 4. 캐릭터 및 분신 (Y좌표 정렬)
        const renderList = [p1, p2, ...scytherClones].sort((a, b) => a.y - b.y);
        for (const char of renderList) char.draw(ctx);

        // 5. 파티클
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const pt of particles) pt.draw(ctx);
        ctx.restore();

        // 6. 데미지 텍스트
        for (const dt of damageTexts) dt.draw(ctx);

        // 7. 조준선
        if (p1 && p1.isAlive) {
            ctx.save();
            const crosshairCol = (p1.species === 'charmander') ? 'rgba(255, 112, 67, 0.9)' : (p1.species === 'squirtle' ? 'rgba(0, 229, 255, 0.9)' : (p1.species === 'bulbasaur' ? 'rgba(0, 230, 118, 0.9)' : (p1.species === 'scyther' ? 'rgba(118, 255, 3, 0.95)' : (p1.species === 'lucario' ? 'rgba(41, 121, 255, 0.95)' : 'rgba(255, 215, 0, 0.95)'))));
            ctx.strokeStyle = crosshairCol;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 14, 0, Math.PI * 2);
            ctx.moveTo(mouse.x - 20, mouse.y); ctx.lineTo(mouse.x - 7, mouse.y);
            ctx.moveTo(mouse.x + 7, mouse.y); ctx.lineTo(mouse.x + 20, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 20); ctx.lineTo(mouse.x, mouse.y - 7);
            ctx.moveTo(mouse.x, mouse.y + 7); ctx.lineTo(mouse.x, mouse.y + 20);
            ctx.stroke();

            ctx.strokeStyle = (p1.species === 'charmander') ? 'rgba(255, 87, 34, 0.25)' : (p1.species === 'squirtle' ? 'rgba(0, 229, 255, 0.25)' : (p1.species === 'bulbasaur' ? 'rgba(0, 230, 118, 0.25)' : (p1.species === 'scyther' ? 'rgba(118, 255, 3, 0.3)' : (p1.species === 'lucario' ? 'rgba(41, 121, 255, 0.25)' : 'rgba(255, 215, 0, 0.3)'))));
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();

        // 8. 화면 밖 적 화살표 인디케이터
        drawOffscreenIndicator(ctx, p2);

        // 9. 미니맵 레이더
        drawMiniMap(ctx);
    }

    // 버튼 이벤트 리스너 등록
    document.getElementById('btn-switch-char').addEventListener('click', switchHero);
    document.getElementById('btn-switch-enemy').addEventListener('click', switchEnemyHero);
    document.getElementById('btn-reset').addEventListener('click', () => initBattle());
    document.getElementById('btn-modal-restart').addEventListener('click', () => initBattle());

    // 난이도 버튼 이벤트 (샌드백, 쉬움, 보통, 어려움, 지옥)
    document.querySelectorAll('.btn-diff').forEach(btn => {
        btn.addEventListener('click', () => {
            const diff = btn.getAttribute('data-diff');
            setDifficulty(diff);
        });
    });

    // 스킬 슬롯 직접 클릭
    ['attack', 'q', 'e', 'r', 'f'].forEach(slot => {
        const el = document.getElementById(`slot-${slot}`);
        if (el) {
            el.style.cursor = 'pointer';
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                sfx.init();
                if (p1 && p1.isAlive) p1.useSkill(slot);
            });
        }
    });

    initBattle();
    setDifficulty('hell');
    requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
