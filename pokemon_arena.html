<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 아레나 2D (Pokémon Arena 2D) - 피카츄 참전 & 대형 스타디움</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508;
            font-family: 'Press Start 2P', 'Noto Sans KR', sans-serif;
            color: #fff;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0c1420 0%, #020305 100%);
        }

        /* 1280 x 720 게임 뷰포트 (대형 3000 x 1900 맵의 카메라 화면) */
        #arena-container {
            position: relative;
            width: 1280px;
            height: 720px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 4px #1c2638;
            border: 4px solid #000;
            overflow: hidden;
            background: #080d15;
            image-rendering: pixelated;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* 오버레이 HUD 레이어 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 18px;
            z-index: 10;
        }

        /* 상단 플레이어 & 상대 상태바 (레트로 포켓몬 도트 UI) */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 16px;
        }

        .poke-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f1523;
            padding: 8px 14px;
            border: 3px solid #334460;
            box-shadow: 
                0 0 0 2px #0a0e17,
                0 6px 0 0 rgba(0, 0, 0, 0.8),
                inset 0 0 0 2px #1e293b;
            min-width: 380px;
            image-rendering: pixelated;
        }

        .poke-card.right {
            flex-direction: row-reverse;
            text-align: right;
        }

        .card-avatar {
            width: 58px;
            height: 58px;
            background: #141c2c;
            border: 3px solid #4a5d80;
            box-shadow: inset 0 0 0 2px #0c121d, 2px 2px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-avatar img {
            width: 52px;
            height: 52px;
            image-rendering: pixelated;
        }

        .card-info {
            flex-grow: 1;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .card-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 0px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 1px 1px 0 #000;
        }

        .level-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #ffd700;
            background: #000;
            padding: 2px 5px;
            border: 2px solid #555;
            box-shadow: 1px 1px 0 #000;
        }

        .gender-male {
            color: #00e5ff;
            font-size: 11px;
        }

        .hp-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: -0.5px;
        }

        /* 도트 스타일 HP 바 래퍼 */
        .hp-row-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .hp-label-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            font-weight: 900;
            background: #e65100;
            color: #fff;
            padding: 2px 5px;
            border: 2px solid #000;
            box-shadow: 1px 1px 0 #000;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            text-shadow: 1px 1px 0 #000;
        }

        .hp-outer {
            flex-grow: 1;
            height: 16px;
            background: #000;
            border: 2px solid #334460;
            box-shadow: inset 0 0 0 1px #111;
            position: relative;
            overflow: hidden;
            padding: 1px;
        }

        .hp-inner {
            height: 100%;
            width: 100%;
            background-color: #00e676;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.3) 0px,
                rgba(255, 255, 255, 0.3) 3px,
                transparent 3px,
                transparent 6px
            );
            border-right: 2px solid #000;
            transition: width 0.15s steps(20, end);
        }

        .hp-inner.yellow {
            background-color: #ffb300;
        }

        .hp-inner.red {
            background-color: #ff1744;
        }

        /* 도트 스태미나 바 */
        .stamina-outer {
            width: 100%;
            height: 7px;
            background: #000;
            border: 2px solid #222d3d;
            overflow: hidden;
            margin-top: 4px;
            padding: 1px;
        }

        .stamina-inner {
            height: 100%;
            width: 100%;
            background-color: #00e5ff;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.35) 0px,
                rgba(255, 255, 255, 0.35) 2px,
                transparent 2px,
                transparent 4px
            );
            border-right: 2px solid #000;
            transition: width 0.05s steps(15, end);
        }

        /* 하단 HUD: 스킬은 왼쪽 밑, 컨트롤은 오른쪽 밑 */
        .bottom-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }

        /* 왼쪽 밑 스킬 바 컨테이너 (도트 레트로 스타일) */
        .bottom-left-hud {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }

        .skill-bar-header {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #ffd700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 2px 2px 0 #000;
            padding-left: 2px;
        }

        .skill-bar-corner {
            display: flex;
            gap: 6px;
            background: #0b1019;
            padding: 6px 10px;
            border: 3px solid #455a7e;
            box-shadow: 
                0 0 0 2px #000,
                0 6px 0 0 rgba(0,0,0,0.8),
                inset 0 0 0 2px #182335;
        }

        .skill-slot {
            width: 58px;
            height: 58px;
            background: #111724;
            border: 2px solid #2b3952;
            box-shadow: 2px 2px 0 #000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.1s;
        }

        .skill-slot:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }

        .skill-icon {
            font-size: 19px;
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 0 #000);
        }

        .skill-name {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 9.5px;
            font-weight: 900;
            color: #ddd;
            text-align: center;
            line-height: 1.1;
        }

        .skill-key {
            position: absolute;
            top: 2px;
            left: 2px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #ffd700;
            background: #000;
            padding: 1px 3px;
            border: 1px solid #444;
        }

        .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #ffeb3b;
            opacity: 0;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }

        .cooldown-overlay.on-cd {
            opacity: 1;
        }

        /* 오른쪽 밑 조작 툴바 및 버튼 */
        .bottom-right-hud {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }

        .controls-info-box {
            display: flex;
            gap: 10px;
            background: #0b1019;
            padding: 6px 14px;
            border: 2px solid #2b3952;
            box-shadow: 2px 2px 0 #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #8899aa;
            align-items: center;
        }

        .controls-info-box span b {
            color: #00e5ff;
            background: #141c2c;
            padding: 2px 4px;
            border: 1px solid #334460;
        }

        .buttons-row {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: #151e2e;
            color: #fff;
            border: 2px solid #3d4f6d;
            box-shadow: 2px 2px 0 #000;
            padding: 6px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-action:hover {
            background: #233149;
            border-color: #ffd700;
            transform: translateY(-2px);
            box-shadow: 2px 4px 0 #000;
        }

        .btn-restart-accent {
            background: #d84315 !important;
            color: #fff !important;
            border: 2px solid #ffab00 !important;
            box-shadow: 2px 2px 0 #000, 0 0 10px rgba(255, 111, 0, 0.4);
        }
        .btn-restart-accent:hover {
            background: #f4511e !important;
            box-shadow: 2px 4px 0 #000, 0 0 16px rgba(255, 171, 0, 0.8);
        }

        .btn-enemy-accent {
            background: #006064 !important;
            border-color: #00e5ff !important;
        }
        .btn-enemy-accent:hover {
            background: #00838f !important;
            border-color: #80d8ff !important;
        }

        .btn-train-accent {
            background: #4a148c !important;
            border-color: #b388ff !important;
            box-shadow: 2px 2px 0 #000, 0 0 10px rgba(179, 136, 255, 0.35);
        }
        .btn-train-accent:hover {
            background: #6a1b9a !important;
            border-color: #ea80fc !important;
            box-shadow: 2px 4px 0 #000, 0 0 16px rgba(234, 128, 252, 0.7);
        }

        /* 난이도 선택 툴바 */
        .difficulty-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
            background: rgba(10, 15, 25, 0.88);
            padding: 5px 8px;
            border: 2px solid #233148;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #111a28;
        }
        .difficulty-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #ffd700;
            margin-right: 2px;
            text-shadow: 1px 1px 0 #000;
        }
        .btn-diff {
            background: #111827;
            color: #94a3b8;
            border: 2px solid #283548;
            font-family: 'Press Start 2P', 'Noto Sans KR', sans-serif;
            font-size: 8px;
            font-weight: 700;
            padding: 5px 9px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 1px 2px 0 #000;
            outline: none;
        }
        .btn-diff:hover {
            background: #1e293b;
            color: #f8fafc;
            border-color: #475569;
            transform: translateY(-1px);
        }
        .btn-diff.active {
            color: #000;
            font-weight: 900;
            border-color: #fff;
            transform: translateY(-1px);
        }
        .btn-diff[data-diff="sandbag"].active {
            background: #9e9e9e;
            box-shadow: 0 0 10px rgba(158, 158, 158, 0.8);
        }
        .btn-diff[data-diff="easy"].active {
            background: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.8);
        }
        .btn-diff[data-diff="normal"].active {
            background: #29b6f6;
            box-shadow: 0 0 10px rgba(41, 182, 246, 0.8);
        }
        .btn-diff[data-diff="hard"].active {
            background: #ffa726;
            box-shadow: 0 0 10px rgba(255, 167, 38, 0.8);
        }
        .btn-diff[data-diff="hell"].active {
            background: #ff1744;
            color: #fff;
            border-color: #ff8a80;
            box-shadow: 0 0 14px rgba(255, 23, 68, 0.9), 0 0 24px rgba(255, 82, 82, 0.6);
            animation: hellGlow 1.2s infinite alternate;
        }
        @keyframes hellGlow {
            from { box-shadow: 0 0 10px rgba(255, 23, 68, 0.7); }
            to { box-shadow: 0 0 20px rgba(255, 23, 68, 1), 0 0 32px rgba(255, 82, 82, 0.8); }
        }

        /* AI 강화 훈련소 모달 */
        #ai-training-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 900px;
            max-width: 94vw;
            max-height: 90vh;
            background: #080d17;
            border: 4px solid #7c4dff;
            box-shadow: 0 0 40px rgba(124, 77, 255, 0.45), 8px 8px 0 #000;
            padding: 22px 26px;
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            overflow-y: auto;
        }
        #ai-training-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .train-modal-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            border-bottom: 2px solid #233149;
            padding-bottom: 12px;
            position: relative;
        }
        .train-modal-icon {
            font-size: 32px;
            background: #141c2c;
            border: 2px solid #7c4dff;
            padding: 6px 10px;
        }
        .train-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #b388ff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .train-modal-desc {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 12px;
            color: #90a4ae;
            line-height: 1.4;
        }
        .train-modal-desc b {
            color: #ffd700;
        }
        .btn-modal-close {
            position: absolute;
            top: 0;
            right: 0;
            background: #151e2e;
            border: 2px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .btn-modal-close:hover {
            background: #ff1744;
            border-color: #ff5252;
        }
        .train-progress-section {
            background: #0f1724;
            border: 2px solid #28374d;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .train-progress-header {
            display: flex;
            justify-content: space-between;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            color: #ffd700;
            margin-bottom: 8px;
        }
        .train-progress-outer {
            width: 100%;
            height: 16px;
            background: #000;
            border: 2px solid #334460;
            padding: 2px;
            overflow: hidden;
        }
        .train-progress-inner {
            height: 100%;
            background: linear-gradient(90deg, #7c4dff, #00e5ff, #00e676);
            transition: width 0.08s ease;
        }
        .train-metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .metric-card {
            background: #0f1624;
            border: 2px solid #233149;
            padding: 10px 8px;
            text-align: center;
        }
        .metric-card.highlight {
            border-color: #ffd700;
            background: #151f33;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }
        .metric-title {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #90a4ae;
            margin-bottom: 5px;
        }
        .metric-val {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fff;
            margin-bottom: 4px;
        }
        .metric-val.green {
            color: #00e676;
        }
        .metric-sub {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 10px;
            color: #78909c;
        }
        .train-table-box {
            background: #0f1724;
            border: 2px solid #233149;
            padding: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        .train-stats-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11px;
            text-align: center;
        }
        .train-stats-table th {
            background: #141f30;
            color: #b0bec5;
            padding: 7px 6px;
            border: 1px solid #223046;
            font-size: 11px;
        }
        .train-stats-table td {
            padding: 6px 6px;
            border: 1px solid #1c2738;
            color: #e2e8f0;
        }
        .train-actions-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
        }
        .btn-train-run {
            background: #6200ea;
            color: #fff;
            border: 3px solid #b388ff;
            box-shadow: 3px 3px 0 #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 9px 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-train-run:hover {
            background: #7c4dff;
            transform: scale(1.03);
            box-shadow: 0 0 16px rgba(179, 136, 255, 0.6);
        }
        .btn-train-toggle {
            background: #151e2e;
            color: #90a4ae;
            border: 2px solid #334460;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .btn-train-toggle.active {
            background: #004d40;
            color: #00e676;
            border-color: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }
        .btn-train-close {
            background: #263238;
            color: #fff;
            border: 2px solid #455a64;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 12px;
            padding: 8px 14px;
            cursor: pointer;
        }
        .btn-train-close:hover {
            background: #37474f;
            border-color: #78909c;
        }

        #alert-box {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            color: #ffd700;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s steps(4), transform 0.25s ease;
            z-index: 100;
            text-align: center;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border: 3px solid #ffd700;
            box-shadow: 4px 4px 0 #000;
        }

        /* 게임 오버 모달 (도트 스타일) */
        #game-over-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #0b1019;
            border: 4px solid #ffd700;
            box-shadow: 8px 8px 0 #000, inset 0 0 0 3px #233149;
            padding: 30px 45px;
            text-align: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s steps(6);
        }

        #game-over-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            margin-bottom: 12px;
            text-shadow: 3px 3px 0 #000;
        }

        #modal-subtitle {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #ccc;
            margin-bottom: 22px;
        }

        .btn-modal-restart {
            background: #e65100;
            color: #fff;
            border: 3px solid #ffeb3b;
            box-shadow: 4px 4px 0 #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 12px 28px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-modal-restart:hover {
            transform: scale(1.05);
            background: #f4511e;
        }
    </style>
</head>
<body>
    <div id="game-viewport">
        <div id="arena-container">
            <canvas id="gameCanvas"></canvas>

            <div id="hud">
                <!-- 상단 도트 HP 바 -->
                <div class="top-hud">
                    <div class="poke-card" id="p1-card">

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.38);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(200, now + 0.38);
            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);
            osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.4);
        }
        playExtremeSpeed() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.18);
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1600, now);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.19);
            osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.2);
        }
        playBoneBoomerang() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(620, now);
            osc.frequency.linearRampToValueAtTime(380, now + 0.12);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.14);
        }
        playBoneRushToss() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(980, now + 0.14);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.18);
        }
        playBoneRushSmash() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const gain = this.ctx.createGain();

            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.48);
        }
    }

    const particles = [];
