    class Particle {
        constructor(x, y, vx, vy, color, size, life, shape = 'circle') {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.color = color; this.size = size; this.initialSize = size;
            this.life = life; this.maxLife = life; this.shape = shape;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.life--;
            this.size = this.initialSize * (this.life / this.maxLife);
        }
        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            if (this.shape === 'circle') {
                ctx.beginPath();
                ctx.arc(0, 0, Math.max(1, this.size), 0, Math.PI * 2);
                ctx.fill();
            } else if (this.shape === 'flame') {
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 1.4);
                ctx.quadraticCurveTo(this.size, 0, 0, this.size);
                ctx.quadraticCurveTo(-this.size, 0, 0, -this.size * 1.4);
                ctx.fill();
            } else if (this.shape === 'star') {
                ctx.fillRect(-this.size, -this.size * 0.25, this.size * 2, this.size * 0.5);
                ctx.fillRect(-this.size * 0.25, -this.size, this.size * 0.5, this.size * 2);
            } else if (this.shape === 'petal') {
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 1.5, this.size * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (this.shape === 'spark') {
                // 날카로운 다이아몬드/십자형 전기 스파크 파티클
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 1.5);
                ctx.lineTo(this.size * 0.45, 0);
                ctx.lineTo(0, this.size * 1.5);
                ctx.lineTo(-this.size * 0.45, 0);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class DamageText {
        constructor(x, y, text, color = '#ffeb3b', isCrit = false) {
            this.x = x + (Math.random() - 0.5) * 20;
            this.y = y - 48;
            this.text = text;
            this.color = color;
            this.isCrit = isCrit;
            this.life = 45; this.maxLife = 45;
            this.vy = isCrit ? -3.0 : -2.0;
        }
        update() {
            this.y += this.vy;
            this.vy *= 0.93;
            this.life--;
        }
        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `900 ${this.isCrit ? 18 : 13}px 'Press Start 2P', monospace`;
            ctx.fillStyle = this.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.textAlign = 'center';
            ctx.strokeText(this.text, this.x, this.y);
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    // --- 장판 효과 1: 불꽃 장판 (파이리 E스킬) ---
    class GroundFlameField {
        constructor(x, y, owner, radius = 140, duration = 300, damagePerTick = 16) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.pulse = 0;
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.08;

            if (Math.random() < 0.7) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * this.radius;
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, (Math.random() - 0.5) * 1.5, -Math.random() * 3 - 1, Math.random() < 0.5 ? '#ff3d00' : '#ffea00', Math.random() * 10 + 4, 25, 'flame'));
            }

            if (this.tickTimer % 15 === 0) {
                for (const target of targets) {
                    if (target !== this.owner && target.isAlive) {
                        const dist = Math.hypot(target.x - this.x, target.y - this.y);
                        if (dist <= this.radius + target.radius) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            triggerScreenShake(2);
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.8;
            const grad = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(255, 234, 0, 0.85)');
            grad.addColorStop(0.5, 'rgba(255, 68, 0, 0.55)');
            grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ff9100';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    }

    // --- 장판 효과 2: 씨뿌리기 트랩 (이상해씨 Q스킬 - 적 피해 & 시전자 체력 흡수 힐링) ---
    class LeechSeedTrap {
        constructor(x, y, owner, radius = 135, duration = 360, damagePerTick = 20) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.pulse = 0;
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.08;

            if (Math.random() < 0.6) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * this.radius;
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, 0, -Math.random() * 2 - 0.5, '#76ff03', Math.random() * 6 + 3, 24, 'circle'));
            }

            // 매 18프레임마다 흡수 데미지 및 체력 회복
            if (this.tickTimer % 18 === 0) {
                for (const target of targets) {
                    if (target !== this.owner && target.isAlive) {
                        const dist = Math.hypot(target.x - this.x, target.y - this.y);
                        if (dist <= this.radius + target.radius) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            
                            // 입힌 피해의 25%만큼 시전자 체력 회복! (25%로 추가 너프)
                            if (this.owner.isAlive) {
                                const healAmount = this.damagePerTick * 0.25; // 25% 흡수로 너프
                                const prevHp = this.owner.hp;
                                this.owner.hp = Math.min(this.owner.maxHp, this.owner.hp + healAmount);
                                const healed = Math.round(this.owner.hp - prevHp);
                                if (healed > 0) {
                                    damageTexts.push(new DamageText(this.owner.x, this.owner.y - 20, `+${healed}`, '#00e676', false));
                                }

                                // 적에서 시전자로 날아가는 생명력 흡수 파티클
                                for (let p = 0; p < 4; p++) {
                                    const sx = target.x + (Math.random() - 0.5) * 20;
                                    const sy = target.y + (Math.random() - 0.5) * 20;
                                    const angleToOwner = Math.atan2(this.owner.y - sy, this.owner.x - sx);
                                    const spd = Math.random() * 4 + 7;
                                    particles.push(new Particle(sx, sy, Math.cos(angleToOwner) * spd, Math.sin(angleToOwner) * spd, '#69f0ae', 7, 26, 'circle'));
                                }
                            }
                            sfx.playLeechSeed();
                            triggerScreenShake(2);
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.85;

            // 바닥 녹색 흡수 오라 링
            const grad = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(118, 255, 3, 0.7)');
            grad.addColorStop(0.5, 'rgba(0, 230, 118, 0.35)');
            grad.addColorStop(1, 'rgba(0, 200, 83, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 5, 0, Math.PI * 2);
            ctx.fill();

            // 외곽 테두리 덩굴 링
            ctx.strokeStyle = '#76ff03';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // 중앙 거대 씨앗
            ctx.fillStyle = '#64dd17';
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, 14, 22, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1b5e20';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }
    }

    // --- 장판 효과 3: 독 장판 (이상해씨 R스킬 - 오물폭탄 폭발 후 지속 피해 & 슬로우) ---
    class PoisonField {
        constructor(x, y, owner, radius = 145, duration = 360, damagePerTick = 18) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.pulse = 0;
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.08;

            if (Math.random() < 0.6) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * this.radius;
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, (Math.random() - 0.5) * 1.5, -Math.random() * 2 - 1, Math.random() < 0.5 ? '#e040fb' : '#7c4dff', Math.random() * 8 + 3, 26, 'circle'));
            }

            for (const target of targets) {
                if (target !== this.owner && target.isAlive) {
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    if (dist <= this.radius + target.radius) {
                        // 독 장판 내부 적에게 슬로우 12% 디버프 유지 (20%에서 12%로 약간 너프!)
                        target.applySlow(0.12, 20);

                        // 매 15프레임마다 독 피해
                        if (this.tickTimer % 15 === 0) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            triggerScreenShake(1.5);
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.85;

            // 독극물 보라색 늪
            const grad = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(224, 64, 251, 0.75)');
            grad.addColorStop(0.55, 'rgba(124, 77, 255, 0.45)');
            grad.addColorStop(1, 'rgba(74, 20, 140, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 6, 0, Math.PI * 2);
            ctx.fill();

            // 부글거리는 외곽 링
            ctx.strokeStyle = '#e040fb';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }
    }

    // --- 장판 효과 4: 번개 자기장 돔 (피카츄 F스킬 - 브롤스타즈 지기 궁극기 '우르쾅쾅 돔' 모티브) ---
    class ThunderDomeField {
        constructor(x, y, owner, radius = 240, duration = 450, damagePerTick = 22) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.pulse = 0;
            this.bolts = []; // 돔 내부에 떨어지는 수직 벼락 낙뢰들
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.12;

            // 돔 내부 번개 구름/자기장 파티클 생성
            if (Math.random() < 0.8) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (this.radius * 0.95);
                const col = Math.random() < 0.5 ? '#ffd700' : (Math.random() < 0.8 ? '#00e5ff' : '#ffffff');
                particles.push(new Particle(
                    this.x + Math.cos(angle) * dist,
                    this.y + Math.sin(angle) * dist,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    col,
                    Math.random() * 8 + 3,
                    22,
                    'spark'
                ));
            }

            // 번개 볼트 업데이트
            for (let i = this.bolts.length - 1; i >= 0; i--) {
                this.bolts[i].life--;
                if (this.bolts[i].life <= 0) this.bolts.splice(i, 1);
            }

            // 매 18프레임마다 돔 내부에 무작위(또는 적 위치에) 대형 벼락 낙하!
            if (this.tickTimer % 18 === 0) {
                let strikeX = this.x + (Math.random() - 0.5) * (this.radius * 1.4);
                let strikeY = this.y + (Math.random() - 0.5) * (this.radius * 1.4);
                
                // 적이 돔 안에 있다면 높은 확률로 적 머리 위로 번개가 내리꽂힘!
                for (const target of targets) {
                    if (target !== this.owner && target.isAlive) {
                        const distToTarget = Math.hypot(target.x - this.x, target.y - this.y);
                        if (distToTarget <= this.radius && Math.random() < 0.75) {
                            strikeX = target.x + (Math.random() - 0.5) * 16;
                            strikeY = target.y + (Math.random() - 0.5) * 16;
                            break;
                        }
                    }
                }

                // 벼락 지그재그 경로 생성
                const segments = [];
                let curY = strikeY - 450;
                let curX = strikeX + (Math.random() - 0.5) * 50;
                segments.push({ x: curX, y: curY });
                while (curY < strikeY) {
                    curY += Math.random() * 45 + 35;
                    curX += (Math.random() - 0.5) * 36;
                    segments.push({ x: curX, y: Math.min(strikeY, curY) });
                }

                this.bolts.push({
                    segments,
                    strikeX,
                    strikeY,
                    life: 8,
                    maxLife: 8,
                    width: Math.random() * 4 + 4
                });

                sfx.playThunderbolt();
                triggerScreenShake(3);
                addGroundDecal(strikeX, strikeY, 26, 'electric');

                for (let i = 0; i < 8; i++) {
                    const spd = Math.random() * 6 + 2;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(strikeX, strikeY, Math.cos(a) * spd, Math.sin(a) * spd, '#fff59d', 6, 16, 'spark'));
                }
            }

            // 돔 내부 적 지속 피해 및 마비(슬로우 50%) 부여
            for (const target of targets) {
                if (target !== this.owner && target.isAlive) {
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    if (dist <= this.radius + target.radius) {
                        // 지기 궁극기처럼 돔 내부에서는 이동속도가 50% 둔화
                        target.applySlow(0.50, 25);

                        // 매 14프레임마다 지속 전기 충격 피해
                        if (this.tickTimer % 14 === 0) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            triggerScreenShake(2);
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.9;

            // 1. 거대 번개 폭풍 돔 (자기장 돔) 배경 그라디언트
            const grad = ctx.createRadialGradient(this.x, this.y, 20, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
            grad.addColorStop(0.35, 'rgba(255, 235, 59, 0.35)');
            grad.addColorStop(0.75, 'rgba(0, 229, 255, 0.22)');
            grad.addColorStop(1, 'rgba(0, 184, 212, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 5, 0, Math.PI * 2);
            ctx.fill();

            // 2. 외곽 자기장 돔 경계선 (네온 아크 링)
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3.5;
            ctx.setLineDash([16, 10]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.85)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius - 6, 0, Math.PI * 2);
            ctx.stroke();

            // 3. 돔 외곽을 따라 지지직거리는 전기 아크
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            const arcSteps = 16;
            ctx.beginPath();
            for (let i = 0; i <= arcSteps; i++) {
                const a = (i * Math.PI * 2) / arcSteps + this.pulse * 0.5;
                const r = this.radius + (Math.sin(i * 3 + this.pulse * 4) * 8);
                const px = this.x + Math.cos(a) * r;
                const py = this.y + Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            // 4. 수직 낙뢰 (벼락 스트라이크) 렌더링
            for (const bolt of this.bolts) {
                const bAlpha = bolt.life / bolt.maxLife;
                ctx.save();
                ctx.globalAlpha = bAlpha;

                // 외곽 글로우
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = bolt.width + 6;
                ctx.beginPath();
                for (let j = 0; j < bolt.segments.length; j++) {
                    const pt = bolt.segments[j];
                    if (j === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();

                // 중심 코어 (새하얀 번개)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = bolt.width;
                ctx.beginPath();
                for (let j = 0; j < bolt.segments.length; j++) {
                    const pt = bolt.segments[j];
                    if (j === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();

                ctx.restore();
            }

            ctx.restore();
        }
    }

    // --- 지형 파괴 및 스킬 흔적 데칼 시스템 ---
    const groundDecals = [];

    function addGroundDecal(x, y, radius, type) {
        if (groundDecals.length > 60) groundDecals.shift();
        groundDecals.push({
            x, y, radius, type,
            life: 600, maxLife: 600,
            rotation: Math.random() * Math.PI * 2
        });
    }

    function updateGroundDecals() {
        for (let i = groundDecals.length - 1; i >= 0; i--) {
            const d = groundDecals[i];
            d.life--;
            if (d.life <= 0) groundDecals.splice(i, 1);
        }
    }

    function drawGroundDecals(ctx) {
        for (const d of groundDecals) {
            const alpha = Math.min(1, d.life / 60) * 0.75;
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(d.rotation);
            ctx.globalAlpha = alpha;

            if (d.type === 'scorch') {
                const grad = ctx.createRadialGradient(0, 0, d.radius * 0.2, 0, 0, d.radius);
                grad.addColorStop(0, '#100602');
                grad.addColorStop(0.7, '#241005');
                grad.addColorStop(1, 'rgba(36, 16, 5, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'water') {
                const grad = ctx.createRadialGradient(0, 0, d.radius * 0.1, 0, 0, d.radius);
                grad.addColorStop(0, 'rgba(0, 180, 240, 0.4)');
                grad.addColorStop(0.7, 'rgba(0, 140, 220, 0.25)');
                grad.addColorStop(1, 'rgba(0, 100, 200, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, d.radius, d.radius * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'crater') {
                ctx.fillStyle = '#18120c';
                ctx.beginPath();
                ctx.arc(0, 0, d.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2d2116';
                ctx.lineWidth = 3;
                for (let i = 0; i < 5; i++) {
                    const a = (i * Math.PI * 2) / 5 + 0.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * d.radius, Math.sin(a) * d.radius);
                    ctx.stroke();
                }
            } else if (d.type === 'skid') {
                ctx.fillStyle = 'rgba(20, 15, 10, 0.55)';
                ctx.fillRect(-d.radius, -4, d.radius * 2, 8);
            } else if (d.type === 'sludge') {
                ctx.fillStyle = 'rgba(74, 20, 140, 0.6)';
                ctx.beginPath();
                ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'electric') {
                // 전기 그을음 및 방전 크랙 데칼
                const grad = ctx.createRadialGradient(0, 0, d.radius * 0.1, 0, 0, d.radius);
                grad.addColorStop(0, '#1c1a06');
                grad.addColorStop(0.65, '#2e2600');
                grad.addColorStop(1, 'rgba(46, 38, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 235, 59, 0.45)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const a = (i * Math.PI * 2) / 5;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * d.radius * 0.5, Math.sin(a) * d.radius * 0.5);
                    ctx.lineTo(Math.cos(a + 0.3) * d.radius * 0.9, Math.sin(a + 0.3) * d.radius * 0.9);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }
    }

    const projectiles = [];

    class Projectile {
        constructor(config) {
            this.x = config.x;
            this.y = config.y;
            this.vx = config.vx || 0;
            this.vy = config.vy || 0;
            this.speed = config.speed || 18;
            this.radius = config.radius || 15;
            this.damage = config.damage || 45;
            this.owner = config.owner;
            this.type = config.type;
            this.life = config.life || 110;
            this.piercing = config.piercing || false;
            this.isBlockable = config.isBlockable !== false;
            this.target = config.target || null;
            this.knockback = config.knockback || 7;
            this.angle = config.angle || Math.atan2(this.vy, this.vx);
            this.aimAngle = config.aimAngle !== undefined ? config.aimAngle : Math.atan2(this.vy, this.vx);
            this.baseSpeed = config.baseSpeed || config.speed || Math.hypot(this.vx, this.vy);
            this.crawlSpeed = config.crawlSpeed || 1.0;
            this.wobble = Math.random() * 10;
            this.hitTargets = new Set();
            this.hitCooldowns = new Map();

            // 평타 및 스킬 사거리 설정
            this.range = (config.range !== undefined) ? config.range : (
                this.type === 'ember' ? 430 : (
                    this.type === 'water_gun' ? 450 : (
                        this.type === 'energy_ball' ? 450 : (
                            this.type === 'thunderbolt' ? 460 : (
                                this.type === 'electroweb' ? 580 : (
                                    this.type === 'sludge_bomb' ? 520 : (
                                        this.type === 'air_cutter' ? 650 : (
                                            this.type === 'aura_sphere' ? 620 : (
                                                this.type === 'bone_rush_toss' ? 700 : null
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
            this.traveled = 0;
        }

        expireRange() {
            // 사거리 도달 시 소멸 효과
            if (this.type === 'ember') {
                for (let i = 0; i < 6; i++) {
                    const spd = Math.random() * 3 + 1;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.5 ? '#ff9100' : '#ffea00', Math.random() * 6 + 3, 16, 'flame'));
                }
            } else if (this.type === 'water_gun') {
                sfx.playPop();
                for (let i = 0; i < 6; i++) {
                    const spd = Math.random() * 3 + 1;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#00e5ff', Math.random() * 6 + 3, 16, 'circle'));
                }
            } else if (this.type === 'energy_ball') {
                sfx.playPop();
                for (let i = 0; i < 7; i++) {
                    const spd = Math.random() * 3 + 1;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#76ff03', Math.random() * 6 + 3, 16, 'circle'));
                }
            } else if (this.type === 'thunderbolt') {
                sfx.playThunderbolt();
                for (let i = 0; i < 6; i++) {
                    const spd = Math.random() * 4 + 1;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.6 ? '#fff59d' : '#00e5ff', Math.random() * 6 + 2, 14, 'spark'));
                }
            } else if (this.type === 'electroweb') {
                for (let i = 0; i < 8; i++) {
                    const spd = Math.random() * 3 + 1;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#ffd700', Math.random() * 6 + 3, 16, 'spark'));
                }
            } else if (this.type === 'air_cutter') {
                for (let i = 0; i < 6; i++) {
                    const spd = Math.random() * 3 + 1;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#76ff03', Math.random() * 5 + 2, 14, 'spark'));
                }
            } else if (this.type === 'sludge_bomb') {
                // 오물폭탄이 사거리 끝에 도달했을 때도 독 장판 생성!
                this.explodeSludgeBomb();
            } else if (this.type === 'thunder_orb') {
                // 번개 구체 목표 지점 도달 시 벼락 폭풍 돔 소환!
                this.detonateThunderDome();
            } else if (this.type === 'aura_sphere') {
                // 파동탄 사거리 도달 시 범위 폭발!
                this.explodeAuraSphere();
            } else if (this.type === 'bone_rush_toss') {
                // 본러시 뼈다귀 목표 위치 도달 시 그 자리에 박힘!
                if (this.owner && typeof this.owner.plantBoneRushAnchor === 'function') {
                    this.owner.plantBoneRushAnchor(this.x, this.y);
                }
            }
            this.life = 0;
        }

        explodeAuraSphere() {
            if (this.hasExploded) return;
            this.hasExploded = true;
            sfx.playAuraExplosion();
            triggerScreenShake(12);
            triggerHitstop(6);
            addGroundDecal(this.x, this.y, 45, 'crater');
            addGroundDecal(this.x, this.y, 38, 'electric');

            // 주변 범위 공격 (반경 130px)
            const splashRadius = 130;
            const validTargets = (typeof p1 !== 'undefined' && typeof p2 !== 'undefined') ? 
                [p1, p2, ...(typeof scytherClones !== 'undefined' ? scytherClones : [])].filter(c => c && c !== this.owner && c.isAlive) : [];
            for (const tgt of validTargets) {
                const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                if (dist <= splashRadius + tgt.radius) {
                    const ang = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                    const kbX = Math.cos(ang) * 16;
                    const kbY = Math.sin(ang) * 16;
                    tgt.takeDamage(this.damage, this.owner, true, kbX, kbY);
                }
            }

            for (let i = 0; i < 22; i++) {
                const spd = Math.random() * 7 + 3;
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.6 ? '#2979ff' : '#00e5ff', Math.random() * 8 + 4, 22, 'spark'));
            }
            showAlert('💥 파동탄 폭발 (AURA SPHERE EXPLOSION)! 💥');
        }

        explodeSludgeBomb() {
            sfx.playSludgeBomb();
            triggerScreenShake(7);
            addGroundDecal(this.x, this.y, 45, 'sludge');
            groundEffects.push(new PoisonField(this.x, this.y, this.owner, 145, 360, 18));

            for (let i = 0; i < 18; i++) {
                const spd = Math.random() * 6 + 2;
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.5 ? '#e040fb' : '#aa00ff', Math.random() * 9 + 4, 25, 'circle'));
            }
            showAlert('SLUDGE POISON POOL!');
        }

        detonateThunderDome() {
            sfx.playThunderDome();
            triggerScreenShake(18);
            triggerHitstop(6);
            addGroundDecal(this.x, this.y, 60, 'electric');
            groundEffects.push(new ThunderDomeField(this.x, this.y, this.owner, 240, 450, 22));

            for (let i = 0; i < 28; i++) {
                const spd = Math.random() * 8 + 3;
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(
                    this.x, this.y,
                    Math.cos(a) * spd, Math.sin(a) * spd,
                    Math.random() < 0.4 ? '#ffffff' : (Math.random() < 0.7 ? '#ffd700' : '#00e5ff'),
                    Math.random() * 9 + 4,
                    28,
                    'spark'
                ));
            }
            showAlert('⚡ THUNDERSTORM DOME ACTIVATED! ⚡');
        }

        update(arenaEnemies, allProjectiles) {
            this.life--;
            this.wobble += 0.12;

            // 사거리 체크
            const stepDist = Math.hypot(this.vx, this.vy);
            this.traveled += stepDist;
            if (this.range !== null && this.traveled >= this.range) {
                this.expireRange();
                return;
            }

            if (this.type === 'dragon_pulse' && this.target && this.target.isAlive) {
                const targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                let diff = targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * 0.095;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;

                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, '#00e5ff', 9, 22, 'circle'));
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, '#7c4dff', 11, 26, 'circle'));
            }

            if (this.type === 'flamethrower') {
                this.radius += 0.6;
                this.vx *= 0.985;
                this.vy *= 0.985;
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, Math.random() < 0.6 ? '#ff5722' : '#ffea00', Math.random() * 14 + 6, 22, 'flame'));
            }

            if (this.type === 'sludge_bomb') {
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, '#e040fb', Math.random() * 6 + 3, 16, 'circle'));
            }

            if (this.type === 'thunderbolt') {
                // 초고속 전격탄 스파크 트레일
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, Math.random() < 0.6 ? '#ffea00' : '#00e5ff', Math.random() * 5 + 2, 12, 'spark'));
            }

            if (this.type === 'electroweb') {
                // 전방위 일렉트릭 네트 스파크 트레일
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 1.5, '#ffd700', Math.random() * 4 + 2, 12, 'spark'));
            }

            if (this.type === 'air_cutter') {
                // 에어커터 바람의 칼날 스파크 트레일
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, Math.random() < 0.6 ? '#76ff03' : '#ffffff', Math.random() * 5 + 2, 12, 'spark'));
            }

            if (this.type === 'thunder_orb') {
                // 지기 번개 플라즈마 구체 트레일
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, Math.random() < 0.5 ? '#00e5ff' : '#ffffff', Math.random() * 8 + 3, 16, 'spark'));
            }

            if (this.type === 'aura_sphere') {
                // 루카리오 Q: 파동탄 (약간 유도가 되는 범위 구체)
                if (Math.random() < 0.8) {
                    particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, Math.random() < 0.6 ? '#2979ff' : '#00e5ff', Math.random() * 6 + 3, 14, 'spark'));
                }
                let closestEnemy = null;
                let minD = 600;
                for (const enemy of arenaEnemies) {
                    if (enemy !== this.owner && enemy.isAlive) {
                        const d = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                        if (d < minD) {
                            minD = d;
                            closestEnemy = enemy;
                        }
                    }
                }
                if (closestEnemy) {
                    const targetAng = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                    let diff = targetAng - this.aimAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    this.aimAngle += diff * 0.045; // 완만한 유도 선회
                    this.vx = Math.cos(this.aimAngle) * this.speed;
                    this.vy = Math.sin(this.aimAngle) * this.speed;
                    this.angle = this.aimAngle;
                }
            }

            if (this.type === 'bone_boomerang') {
                // 루카리오 R: 뼈다귀 부메랑 (부채꼴 흩뿌림 -> 적 유도 관통 -> 루카리오에게 복귀)
                this.wobble += 0.42;
                if (!this.boomerangTicks) this.boomerangTicks = 0;
                this.boomerangTicks++;

                if (Math.random() < 0.5) {
                    particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, '#80d8ff', Math.random() * 5 + 2, 12, 'spark'));
                }

                if (this.boomerangTicks <= 18) {
                    // 1단계: 앞으로 흩뿌려짐
                    this.vx *= 0.95;
                    this.vy *= 0.95;
                } else if (this.boomerangTicks <= 50) {
                    // 2단계: 적 쪽으로 유도
                    let closestEnemy = null;
                    let minD = 900;
                    for (const enemy of arenaEnemies) {
                        if (enemy !== this.owner && enemy.isAlive) {
                            const d = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                            if (d < minD) {
                                minD = d;
                                closestEnemy = enemy;
                            }
                        }
                    }
                    if (closestEnemy) {
                        const targetAng = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                        let diff = targetAng - this.aimAngle;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        this.aimAngle += diff * 0.13;
                        this.vx = Math.cos(this.aimAngle) * 22;
                        this.vy = Math.sin(this.aimAngle) * 22;
                    }
                } else {
                    // 3단계: 루카리오에게로 복귀
                    if (this.owner && this.owner.isAlive) {
                        const targetAng = Math.atan2(this.owner.y - this.y, this.owner.x - this.x);
                        let diff = targetAng - this.aimAngle;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        this.aimAngle += diff * 0.16;
                        this.vx = Math.cos(this.aimAngle) * 25;
                        this.vy = Math.sin(this.aimAngle) * 25;

                        // 루카리오에게 도달 시 소멸
                        if (Math.hypot(this.owner.x - this.x, this.owner.y - this.y) <= 34) {
                            this.life = 0;
                            for (let p = 0; p < 4; p++) {
                                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, '#ffffff', 5, 12, 'spark'));
                            }
                        }
                    }
                }
            }

            if (this.type === 'bone_rush_toss') {
                // 루카리오 F: 본러시 푸른 뼈다귀 투척
                this.wobble += 0.45;
                if (Math.random() < 0.7) {
                    particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, '#00e5ff', Math.random() * 6 + 3, 14, 'spark'));
                }
            }

            if (this.type === 'thunder_slow_orb') {
                // 피카츄 F스킬 '번개' (브롤스타즈 지기 궁극기):
                // 절반 정도 갔을 때 가장 가까운 적 방향으로 궤적이 급격히 꺾임 & 초대형 전격 구체
                if (!this.maxLife) this.maxLife = this.life;
                if (!this.hasBent && this.life <= this.maxLife * 0.52) {
                    this.hasBent = true;
                    let closestEnemy = null;
                    let minD = Infinity;
                    for (const enemy of arenaEnemies) {
                        if (enemy !== this.owner && enemy.isAlive) {
                            const d = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                            if (d < minD) {
                                minD = d;
                                closestEnemy = enemy;
                            }
                        }
                    }
                    if (closestEnemy) {
                        this.aimAngle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x);
                        sfx.playThunderbolt();
                        triggerScreenShake(4.5);
                        for (let p = 0; p < 22; p++) {
                            const spd = Math.random() * 8 + 3;
                            const a = Math.random() * Math.PI * 2;
                            particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#00e5ff', 8, 22, 'spark'));
                            particles.push(new Particle(this.x, this.y, Math.cos(a) * (spd * 0.7), Math.sin(a) * (spd * 0.7), '#ffd700', 6, 20, 'spark'));
                        }
                        showAlert('⚡ 번개 구체 유도 궤적 꺾임 (적 추적)! ⚡');
                    }
                }

                let isCatchingEnemy = false;
                const fAngle = this.aimAngle !== undefined ? this.aimAngle : Math.atan2(this.vy, this.vx);

                for (const enemy of arenaEnemies) {
                    if (enemy !== this.owner && enemy.isAlive) {
                        const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                        if (dist <= this.radius + enemy.radius) {
                            isCatchingEnemy = true;

                            // 1. 적에게 최초 피격 시 0.26초(16프레임) 가벼운 멈칫 경직 부여 (이후엔 35% 마일드 슬로우로 즉시 탈출 가능!)
                            if (!this.hitTargets.has(enemy)) {
                                this.hitTargets.add(enemy);
                                enemy.applyStun(16); // 0.26초 짧은 멈칫 경직
                            } else {
                                enemy.applySlow(0.35, 18); // 경직 후 35% 마일드 슬로우 부여
                            }

                            // 2. 적을 플라즈마 폭풍 안으로 가볍게 견인
                            const pullAngle = Math.atan2(this.y - enemy.y, this.x - enemy.x);
                            enemy.x += Math.cos(pullAngle) * 0.35 + Math.cos(fAngle) * 0.25;
                            enemy.y += Math.sin(pullAngle) * 0.35 + Math.sin(fAngle) * 0.25;

                            // 3. 다단히트 전격 데미지: 안에 머무르면 매 10프레임마다 연속 타격! (딜 대폭 완화)
                            const lastHit = this.hitCooldowns.get(enemy);
                            const hitElapsed = (lastHit === undefined) ? 999 : (lastHit - this.life);
                            if (hitElapsed >= 10) {
                                this.hitCooldowns.set(enemy, this.life);
                                this.onHit(enemy);
                                sfx.playThunderbolt();
                                triggerScreenShake(1.6);

                                for (let p = 0; p < 4; p++) {
                                    particles.push(new Particle(enemy.x + (Math.random() - 0.5) * 45, enemy.y + (Math.random() - 0.5) * 45, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, '#00e5ff', 6, 16, 'spark'));
                                }
                            }
                        }
                    }
                }

                // 맞으면 속도가 1.8로 서서히 적을 긁고 지나감 (탈출 기회 확보)
                const targetSpd = isCatchingEnemy ? (this.crawlSpeed || 1.8) : (this.baseSpeed || 5.2);
                this.vx = Math.cos(fAngle) * targetSpd;
                this.vy = Math.sin(fAngle) * targetSpd;

                // 초대형 회전 전격 폭풍 파티클 & 지형 데칼
                if (Math.random() < 0.92) {
                    const offA = Math.random() * Math.PI * 2;
                    const offR = Math.random() * this.radius;
                    particles.push(new Particle(
                        this.x + Math.cos(offA) * offR,
                        this.y + Math.sin(offA) * offR,
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 5,
                        Math.random() < 0.5 ? '#ffd700' : (Math.random() < 0.8 ? '#00e5ff' : '#ffffff'),
                        Math.random() * 11 + 5,
                        24,
                        'spark'
                    ));
                }
                if (this.life % 12 === 0) {
                    addGroundDecal(this.x, this.y, 65, 'electric');
                }
                if (this.life % 14 === 0) {
                    sfx.playThunderbolt();
                    triggerScreenShake(2.8);
                }
            }

            if (this.type === 'bubble') {
                this.vx *= 0.94;
                this.vy *= 0.94;
                this.x += Math.sin(this.wobble) * 0.8;
                this.y += Math.cos(this.wobble) * 0.8;

                for (let i = allProjectiles.length - 1; i >= 0; i--) {
                    const other = allProjectiles[i];
                    if (other !== this && other.owner !== this.owner && other.isBlockable && !other.piercing) {
                        const dist = Math.hypot(other.x - this.x, other.y - this.y);
                        if (dist <= this.radius + other.radius) {
                            this.popEffect();
                            other.life = 0;
                            this.life = 0;
                            showAlert('BUBBLE SHIELD BLOCKED!');
                            return;
                        }
                    }
                }
            }

            this.x += this.vx;
            this.y += this.vy;

            // 대형 월드 스타디움 방벽 외곽 소멸 체크
            if (this.x < 130 || this.x > WORLD_WIDTH - 130 || this.y < 120 || this.y > WORLD_HEIGHT - 120) {
                if (this.type === 'bubble') this.popEffect();
                if (this.type === 'sludge_bomb') this.explodeSludgeBomb();
                if (this.type === 'thunder_orb') this.detonateThunderDome();
                if (this.type === 'aura_sphere') this.explodeAuraSphere();
                if (this.type === 'bone_rush_toss') {
                    if (this.owner && typeof this.owner.plantBoneRushAnchor === 'function') {
                        this.owner.plantBoneRushAnchor(this.x, this.y);
                    }
                }
                this.life = 0;
            }

            for (const enemy of arenaEnemies) {
                if (enemy !== this.owner && enemy.isAlive) {
                    const dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (dist <= this.radius + enemy.radius) {
                        if (this.type === 'flamethrower') {
                            const lastHit = this.hitCooldowns.get(enemy) || 0;
                            if (this.life - lastHit > 8 || lastHit === 0) {
                                this.hitCooldowns.set(enemy, this.life);
                                this.onHit(enemy);
                            }
                        } else if (this.type === 'thunder_slow_orb') {
                            // thunder_slow_orb은 위에서 맞으면 경직 & 조금씩 전진으로 처리됨
                        } else if (this.type === 'sludge_bomb') {
                            // 오물폭탄 직접 피격 시 폭발 및 장판 생성
                            this.onHit(enemy);
                            this.explodeSludgeBomb();
                            this.life = 0;
                            break;
                        } else if (this.type === 'thunder_orb') {
                            // 지기 번개 플라즈마 구체 피격 시 폭발 및 돔 소환
                            this.onHit(enemy);
                            this.detonateThunderDome();
                            this.life = 0;
                            break;
                        } else if (this.type === 'aura_sphere') {
                            // 파동탄 직접 피격 시 범위 폭발
                            this.onHit(enemy);
                            this.explodeAuraSphere();
                            this.life = 0;
                            break;
                        } else if (this.type === 'bone_rush_toss') {
                            // 본러시 푸른 뼈다귀 피격 시 적 피격 후 그 자리에 박힘!
                            this.onHit(enemy);
                            if (this.owner && typeof this.owner.plantBoneRushAnchor === 'function') {
                                this.owner.plantBoneRushAnchor(this.x, this.y);
                            }
                            this.life = 0;
                            break;
                        } else if (this.type === 'bone_boomerang') {
                            // 뼈다귀 부메랑: 관통 다단 타격 (동일 대상 14프레임 쿨다운)
                            const lastHit = this.hitCooldowns.get(enemy) || 0;
                            if (this.life - lastHit > 14 || lastHit === 0) {
                                this.hitCooldowns.set(enemy, this.life);
                                this.onHit(enemy);
                                sfx.playBoneBoomerang();
                            }
                        } else if (this.piercing) {
                            if (!this.hitTargets.has(enemy)) {
                                this.hitTargets.add(enemy);
                                this.onHit(enemy);
                            }
                        } else {
                            this.onHit(enemy);
                            this.life = 0;
                            break;
                        }
                    }
                }
            }
        }

        popEffect() {
            sfx.playPop();
            for (let i = 0; i < 14; i++) {
                const angle = (Math.PI * 2 * i) / 14;
                const spd = Math.random() * 4 + 2;
                particles.push(new Particle(this.x, this.y, Math.cos(angle) * spd, Math.sin(angle) * spd, '#80d8ff', Math.random() * 6 + 3, 22, 'circle'));
            }
        }

        onHit(target) {
            triggerHitstop(this.type === 'dragon_pulse' ? 8 : (this.type === 'hydro_pump' ? 9 : (this.type === 'flamethrower' ? 2 : (this.type === 'thunder_orb' ? 7 : 5))));
            triggerScreenShake(this.type === 'dragon_pulse' ? 14 : (this.type === 'hydro_pump' ? 22 : (this.type === 'flamethrower' ? 3 : (this.type === 'thunder_orb' ? 16 : 7))));
            sfx.playHit();

            const angle = Math.atan2(this.vy, this.vx);
            const kbX = Math.cos(angle) * this.knockback;
            const kbY = Math.sin(angle) * this.knockback;

            if (this.type === 'bubble') {
                target.applySlow(0.45, 160);
                this.popEffect();
            } else if (this.type === 'electroweb') {
                // 일렉트릭 네트 피격 시 60% 슬로우 부여!
                target.applySlow(0.60, 150);
                sfx.playElectroweb();
            } else if (this.type === 'thunderbolt') {
                sfx.playThunderbolt();
            }

            target.takeDamage(this.damage, this.owner, (this.type === 'dragon_pulse' || this.type === 'hydro_pump'), kbX, kbY);

            // 지형 데칼 생성
            if (this.type === 'ember') addGroundDecal(target.x, target.y, 22, 'scorch');
            else if (this.type === 'flamethrower') addGroundDecal(target.x, target.y, 26, 'scorch');
            else if (this.type === 'dragon_pulse') addGroundDecal(target.x, target.y, 44, 'crater');
            else if (this.type === 'water_gun') addGroundDecal(target.x, target.y, 22, 'water');
            else if (this.type === 'hydro_pump') addGroundDecal(target.x, target.y, 42, 'water');
            else if (this.type === 'energy_ball') addGroundDecal(target.x, target.y, 22, 'scorch');
            else if (this.type === 'thunderbolt') addGroundDecal(target.x, target.y, 22, 'electric');
            else if (this.type === 'electroweb') addGroundDecal(target.x, target.y, 24, 'electric');
            else if (this.type === 'thunder_orb') addGroundDecal(target.x, target.y, 50, 'electric');
            else if (this.type === 'air_cutter') addGroundDecal(target.x, target.y, 22, 'crater');
            else if (this.type === 'aura_sphere') addGroundDecal(target.x, target.y, 36, 'crater');
            else if (this.type === 'bone_rush_toss') addGroundDecal(target.x, target.y, 34, 'crater');
            else if (this.type === 'bone_boomerang') addGroundDecal(target.x, target.y, 20, 'crater');

            const sparkCol = (this.owner.species === 'charmander') ? '#ff9100' : (this.owner.species === 'squirtle' ? '#00e5ff' : (this.owner.species === 'bulbasaur' ? '#76ff03' : (this.owner.species === 'scyther' ? '#76ff03' : (this.owner.species === 'lucario' ? '#2979ff' : '#ffd700'))));
            for (let i = 0; i < 14; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = Math.random() * 8 + 3;
                particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, sparkCol, Math.random() * 7 + 3, 24, 'spark'));
            }
        }

        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);

            if (this.type === 'ember') {
                ctx.globalCompositeOperation = 'lighter';
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius * 1.6);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#ffea00');
                grad.addColorStop(0.7, '#ff5722');
                grad.addColorStop(1, 'rgba(255, 34, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.6, 0, Math.PI * 2);
                ctx.fill();

            } else if (this.type === 'water_gun') {
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.angle);
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius * 1.8);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#00e5ff');
                grad.addColorStop(0.8, '#0288d1');
                grad.addColorStop(1, 'rgba(2, 136, 209, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 2.2, this.radius, 0, 0, Math.PI * 2);
                ctx.fill();

            } else if (this.type === 'energy_ball') {
                ctx.globalCompositeOperation = 'lighter';
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius * 1.8);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#ccff90');
                grad.addColorStop(0.7, '#64dd17');
                grad.addColorStop(1, 'rgba(100, 221, 23, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.8, 0, Math.PI * 2);
                ctx.fill();

                // 에너지볼 코어 링
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.6, 0, Math.PI * 2);
                ctx.stroke();

            } else if (this.type === 'sludge_bomb') {
                ctx.rotate(this.angle);
                ctx.fillStyle = '#6a1b9a';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ba68c8';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 독 거품 하이라이트
                ctx.fillStyle = '#e1bee7';
                ctx.beginPath();
                ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

            } else if (this.type === 'dragon_pulse') {
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(10, 0, 5, 0, 0, this.radius * 2.4);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#00e5ff');
                grad.addColorStop(0.65, '#651fff');
                grad.addColorStop(1, 'rgba(101, 31, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 2.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#00e5ff';
                ctx.beginPath();
                ctx.moveTo(32, 0);
                ctx.lineTo(-14, -24);
                ctx.lineTo(-7, -6);
                ctx.lineTo(-32, -20);
                ctx.lineTo(-16, 0);
                ctx.lineTo(-32, 20);
                ctx.lineTo(-7, 6);
                ctx.lineTo(-14, 24);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(12, -7, 4, 0, Math.PI * 2);
                ctx.arc(12, 7, 4, 0, Math.PI * 2);
                ctx.fill();

            } else if (this.type === 'flamethrower') {
                ctx.globalCompositeOperation = 'lighter';
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius);
                grad.addColorStop(0, 'rgba(255, 255, 220, 0.98)');
                grad.addColorStop(0.35, 'rgba(255, 170, 0, 0.88)');
                grad.addColorStop(0.75, 'rgba(255, 45, 0, 0.7)');
                grad.addColorStop(1, 'rgba(200, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

            } else if (this.type === 'bubble') {
                ctx.globalAlpha = 0.85;
                const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, 2, 0, 0, this.radius);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                grad.addColorStop(0.2, 'rgba(128, 222, 234, 0.65)');
                grad.addColorStop(0.7, 'rgba(38, 198, 218, 0.35)');
                grad.addColorStop(1, 'rgba(0, 151, 167, 0.85)');
                ctx.fillStyle = grad;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.beginPath();
                ctx.ellipse(-this.radius * 0.4, -this.radius * 0.4, this.radius * 0.28, this.radius * 0.14, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();

            } else if (this.type === 'hydro_pump') {
                // 하이드로펌프 위력 300으로 버프된 거대 물대포 연출
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.angle);
                const grad = ctx.createLinearGradient(-this.radius * 2.2, 0, this.radius * 2.2, 0);
                grad.addColorStop(0, 'rgba(0, 229, 255, 0)');
                grad.addColorStop(0.35, '#ffffff');
                grad.addColorStop(0.7, '#00b0ff');
                grad.addColorStop(1, '#0091ea');
                ctx.fillStyle = grad;
                ctx.fillRect(-this.radius * 2.2, -this.radius, this.radius * 4.4, this.radius * 2.0);

            } else if (this.type === 'thunderbolt') {
                // 백만볼트 초고속 전격 화살 (다른 평타보다 빠름)
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius * 2.2);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.35, '#ffea00');
                grad.addColorStop(0.7, '#00e5ff');
                grad.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 2.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(24, 0);
                ctx.lineTo(-4, -10);
                ctx.lineTo(2, 0);
                ctx.lineTo(-20, -8);
                ctx.lineTo(-8, 0);
                ctx.lineTo(-20, 8);
                ctx.lineTo(2, 0);
                ctx.lineTo(-4, 10);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.5;
                ctx.stroke();

            } else if (this.type === 'electroweb') {
                // 일렉트릭 네트 회전 그물망
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.wobble * 1.5);

                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius * 1.6);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                grad.addColorStop(0.35, 'rgba(255, 235, 59, 0.75)');
                grad.addColorStop(0.75, 'rgba(0, 229, 255, 0.35)');
                grad.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.6, 0, Math.PI * 2);
                ctx.fill();

                const sides = 6;
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.4;
                for (let ring = 1; ring <= 2; ring++) {
                    const r = (this.radius / 2) * ring;
                    ctx.beginPath();
                    for (let s = 0; s <= sides; s++) {
                        const a = (s * Math.PI * 2) / sides;
                        const px = Math.cos(a) * r;
                        const py = Math.sin(a) * r;
                        if (s === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.stroke();
                }

                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 1.8;
                for (let s = 0; s < sides; s++) {
                    const a = (s * Math.PI * 2) / sides;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
                    ctx.stroke();
                }

            } else if (this.type === 'thunder_slow_orb' || this.type === 'thunder_orb') {
                // 피카츄 F스킬 '번개': 앞으로 나아가는 초대형 번개 플라즈마 폭풍 구체
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.wobble * 2.5);

                const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, this.radius * 1.55);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.28, '#fff59d');
                grad.addColorStop(0.6, '#ffd700');
                grad.addColorStop(0.85, 'rgba(0, 229, 255, 0.55)');
                grad.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.55, 0, Math.PI * 2);
                ctx.fill();

                // 2. 고압 에너지 핵
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.72, 0, Math.PI * 2);
                ctx.stroke();

                // 3. 지그재그 회전 전기 아크 10줄기 (초거대 폭풍 연출)
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 3.2;
                const arcs = 10;
                for (let a = 0; a < arcs; a++) {
                    const baseA = (a * Math.PI * 2) / arcs + this.wobble * 2.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    let r = 0;
                    let ang = baseA;
                    while (r < this.radius * 1.45) {
                        r += 18;
                        ang += (Math.sin(a * 2 + this.wobble * 4) > 0 ? 0.35 : -0.35);
                        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
                    }
                    ctx.stroke();
                }

                // 4. 외곽 충격파 회전 이중 링
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.8;
                ctx.setLineDash([16, 10]);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.1, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
                ctx.lineWidth = 2.0;
                ctx.setLineDash([10, 14]);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 1.35, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            } else if (this.type === 'air_cutter') {
                // 에어커터 (바람의 칼날 초승달 투사체)
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.angle);

                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, this.radius * 2.0);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.35, '#b9f6ca');
                grad.addColorStop(0.7, '#00e676');
                grad.addColorStop(1, 'rgba(0, 230, 118, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 2.0, 0, Math.PI * 2);
                ctx.fill();

                // 초승달 모양 바람의 칼날
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(4, 0, this.radius * 1.5, -Math.PI / 2.2, Math.PI / 2.2);
                ctx.quadraticCurveTo(-this.radius * 0.4, 0, 4, -this.radius * 1.5);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#76ff03';
                ctx.lineWidth = 2.5;
                ctx.stroke();

            } else if (this.type === 'aura_sphere') {
                // 루카리오 Q: 파동탄 (Aura Sphere)
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.wobble * 2.0);

                const grad = ctx.createRadialGradient(0, 0, 3, 0, 0, this.radius * 2.2);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#80d8ff');
                grad.addColorStop(0.65, '#2979ff');
                grad.addColorStop(1, 'rgba(41, 121, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 2.2, 0, Math.PI * 2);
                ctx.fill();

                // 에너지 코어 링
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3.0;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 0.75, 0, Math.PI * 2);
                ctx.stroke();

                // 회전하는 소용돌이 에너지 고리 3개
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2.2;
                for (let r = 0; r < 3; r++) {
                    const rot = (r * Math.PI / 3) + this.wobble * 3.0;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.radius * 1.35, this.radius * 0.45, rot, 0, Math.PI * 2);
                    ctx.stroke();
                }

            } else if (this.type === 'bone_boomerang') {
                // 루카리오 R: 뼈다귀 부메랑 (Bone Boomerang)
                ctx.globalCompositeOperation = 'source-over';
                ctx.rotate(this.wobble * 2.4);

                // 푸른 오라 후광
                ctx.save();
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 12;

                // 뼈다귀 본체 (중앙 봉 + 양끝 둥근 골두)
                ctx.fillStyle = '#f5f5f5';
                ctx.beginPath();
                ctx.roundRect(-this.radius * 1.3, -4, this.radius * 2.6, 8, 4);
                ctx.fill();

                // 왼쪽 골두 (두 개의 원)
                ctx.beginPath();
                ctx.arc(-this.radius * 1.3, -5, 6, 0, Math.PI * 2);
                ctx.arc(-this.radius * 1.3, 5, 6, 0, Math.PI * 2);
                ctx.fill();

                // 오른쪽 골두
                ctx.beginPath();
                ctx.arc(this.radius * 1.3, -5, 6, 0, Math.PI * 2);
                ctx.arc(this.radius * 1.3, 5, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#2979ff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

            } else if (this.type === 'bone_rush_toss') {
                // 루카리오 F: 본러시 투척 뼈다귀 (Bone Rush Stick)
                ctx.globalCompositeOperation = 'lighter';
                ctx.rotate(this.wobble * 2.8);

                const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, this.radius * 2.4);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#00e5ff');
                grad.addColorStop(0.8, '#2979ff');
                grad.addColorStop(1, 'rgba(41, 121, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius * 2.4, 0, Math.PI * 2);
                ctx.fill();

                // 거대 푸른 뼈다귀 실루엣
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(-this.radius * 1.5, -6, this.radius * 3.0, 12, 6);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(-this.radius * 1.5, -7, 8, 0, Math.PI * 2);
                ctx.arc(-this.radius * 1.5, 7, 8, 0, Math.PI * 2);
                ctx.arc(this.radius * 1.5, -7, 8, 0, Math.PI * 2);
                ctx.arc(this.radius * 1.5, 7, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    const scytherClones = [];

    function spawnXScissorFX(x, y, angle, size = 65) {
        // 십자 배기 시각 효과 (Cross-slash X particle effect)
        for (let sign of [-1, 1]) {
            const slashAngle = angle + (Math.PI / 4) * sign;
            for (let i = -size; i <= size; i += 7) {
                const px = x + Math.cos(slashAngle) * i;
                const py = y + Math.sin(slashAngle) * i;
                particles.push(new Particle(
                    px, py,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    Math.random() < 0.6 ? '#76ff03' : '#ffffff',
                    Math.random() * 6 + 3,
                    14,
                    'spark'
                ));
            }
        }
    }

    class ScytherClone {
        constructor(config) {
            this.owner = config.owner;
            this.x = config.x;
            this.y = config.y;
            this.vx = 0;
            this.vy = 0;
            this.radius = 26;
            this.hp = 80; // "체력은 80"
            this.maxHp = 80;
            this.isAlive = true;
            this.index = config.index || 0;
            this.aimAngle = 0;
            this.facingLeft = false;
            this.walkFrame = 0;
            this.animTick = 0;
            this.attackCooldown = Math.random() * 0.4 + 0.15; // "분신은 스킬은 안쓰고 평타만 쓰고"
            this.speed = 5.5;
            this.stunTimer = 0;
            this.slowTimer = 0;
            this.slowAmount = 0;
            this.species = 'scyther';
            this.name = '스라크';
        }

        applySlow(amount, duration) {
            this.slowAmount = amount;
            this.slowTimer = duration;
        }

        applyStun(duration) {
            this.stunTimer = Math.max(this.stunTimer || 0, duration);
        }

        takeDamage(dmg, attacker, isCrit = false, kbX = 0, kbY = 0, isHazard = false) {
            if (!this.isAlive) return;
            this.hp = Math.max(0, this.hp - dmg);
            damageTexts.push(new DamageText(this.x, this.y, `-${Math.round(dmg)}`, isCrit ? '#ff1744' : '#b2ff59', isCrit));
            if (!isHazard) {
                this.x += (kbX || 0) * 0.45;
                this.y += (kbY || 0) * 0.45;
            }

            if (this.hp <= 0) {
                this.isAlive = false;
                sfx.playPop();
                for (let i = 0; i < 14; i++) {
                    const spd = Math.random() * 5 + 2;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#cfd8dc', Math.random() * 8 + 4, 20, 'circle'));
                }
            }
        }

        update() {
            if (!this.isAlive) return;
            this.animTick++;
            if (this.attackCooldown > 0) this.attackCooldown -= 1 / 60;
            if (this.stunTimer > 0) {
                this.stunTimer--;
                this.vx *= 0.6;
                this.vy *= 0.6;
                this.x += this.vx;
                this.y += this.vy;
                return;
            }

            const target = (this.owner === p1) ? p2 : p1;
            if (!target || !target.isAlive) return;

            const dist = Math.hypot(target.x - this.x, target.y - this.y);
            const angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
            this.aimAngle = angleToTarget;
            this.facingLeft = (target.x < this.x);

            let currentSpeed = this.speed;
            if (this.slowTimer > 0) {
                this.slowTimer--;
                currentSpeed *= (1 - this.slowAmount);
            }

            // 분신들이 겹치지 않고 목표 주변을 에워싸는 포위 기동
            const flankAngle = angleToTarget + (this.index - 2) * 0.38 + Math.sin(this.animTick * 0.04) * 0.25;
            if (dist > 85) {
                this.vx = Math.cos(flankAngle) * currentSpeed;
                this.vy = Math.sin(flankAngle) * currentSpeed;
                this.walkFrame += 0.24;
            } else {
                this.vx *= 0.5;
                this.vy *= 0.5;
            }

            this.x += this.vx;
            this.y += this.vy;

            if (this.x < FIELD_MIN_X) this.x = FIELD_MIN_X;
            if (this.x > FIELD_MAX_X) this.x = FIELD_MAX_X;
            if (this.y < FIELD_MIN_Y) this.y = FIELD_MIN_Y;
            if (this.y > FIELD_MAX_Y) this.y = FIELD_MAX_Y;

            // "분신은 스킬은 안쓰고 평타만 쓰고" (연속자르기 평타)
            if (dist <= 125 && this.attackCooldown <= 0) {
                this.attackCooldown = 0.48; // 약 0.48초마다 평타
                sfx.playSlash();
                for (let i = -3; i <= 3; i++) {
                    const a = this.aimAngle + (i * 0.14);
                    const d = 36;
                    particles.push(new Particle(
                        target.x + Math.cos(a) * d,
                        target.y + Math.sin(a) * d,
                        Math.cos(a) * 3,
                        Math.sin(a) * 3,
                        Math.random() < 0.6 ? '#76ff03' : '#ffffff',
                        Math.random() * 6 + 3,
                        10,
                        'spark'
                    ));
                }
                target.takeDamage(28, this.owner, false, Math.cos(this.aimAngle) * 4, Math.sin(this.aimAngle) * 4);
                damageTexts.push(new DamageText(this.x, this.y - 25, '연속자르기', '#76ff03', false));
                triggerHitstop(2);
            }
        }

        draw(ctx) {
            if (!this.isAlive) return;
            ctx.save();
            ctx.translate(this.x, this.y);

            // 분신 그림자 (본체와 100% 동일)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 24, 28, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // 본체와 100% 똑같이 보이도록 반투명 제거 (불투명 1.0)
            ctx.globalAlpha = 1.0;

            const sheet = spriteSheets.scyther;
            const isSheetReady = sheet && sheet.complete && sheet.naturalWidth > 0;
            // 본체와 100% 동일한 프레임 규격 및 자연스러운 지면 그림자 안착 (40 x 48)
            const fw = 40;
            const fh = 48;
            const destW = 110;
            const destH = 132;
            const destOffX = -destW / 2;
            const destOffY = -64;

            let angle = this.aimAngle;
            if (angle < 0) angle += Math.PI * 2;
            const slice = Math.PI / 4;
            const sector = Math.floor((angle + slice / 2) / slice) % 8;
            const sectorToRow = [2, 1, 0, 7, 6, 5, 4, 3];
            const row = sectorToRow[sector];
            const col = Math.floor(this.walkFrame) % 4;

            if (isSheetReady) {
                ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
            } else {
                ctx.fillStyle = '#66bb6a';
                ctx.fillRect(-14, -26, 28, 42);
            }

            // 본체와 완벽히 똑같이 생기도록 분신 표시 텍스트 및 전용 체력바 제거!
            ctx.restore();
        }
    }
